# The merge gate: `cargo xtask check` over every mod in one build, its
# dependencies compiled once, on a GitHub-hosted runner, and the tests of the
# Windows-only crates natively on a Windows runner, called by ci.yml. A push
# to main runs the full suite and fills the build caches pull requests start
# from. The job `check` sums them up and is the required check.
name: check

on:
  workflow_call:

permissions: {}

env:
  # A pull request and the merge queue check what builds; a push to main, the
  # full suite.
  FULL: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

jobs:
  # Work already proven is not repeated: a merge queue group whose tree is its
  # pull request's own head passed that pull request's check, and a change to
  # files that never build (documents, repository settings, the release
  # workflows) has nothing to compile or test.
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      pages: ${{ steps.scope.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: What is left to prove
        id: scope
        env:
          # A merge queue entry is checked against the entry before it (its
          # group's parent): only its own pull request's changes are new.
          BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"
          reason=""
          pages=true
          if [ "$EVENT" = merge_group ]; then
            number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
            if [ -n "$number" ]; then
              head=$(curl --proto '=https' -sSf -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$number" | jq -r .head.sha)
              git fetch -q origin "$head"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
                reason="the group's tree is pull request #$number's head, whose check passed"
              fi
            fi
          fi
          if [ -n "$reason" ]; then
            pages=false
          elif [ "$FULL" != true ]; then
            git diff --name-only "$BASE...HEAD" | grep -qE '^([^/]+/docs/player[^/]*\.md|\.github/workflows/(ci|check)\.yml)$' || pages=false
            never='^(\.github/(actionlint\.yaml|zizmor\.yml|workflows/release-plz\.yml|actions/release-files/.*)$|[^/]+\.md$|(.*/)?(README|CHANGELOG|ARCHITECTURE)\.md$|[^/]+/docs/|(.*/)?LICENSE$|tools/wine/|\.gitignore$|renovate\.json$|_typos\.toml$|\.rumdl\.toml$|lefthook\.yml$|committed\.toml$|release-plz\.toml$)'
            if ! git diff --name-only "$BASE...HEAD" | grep -qvE "$never"; then
              reason="no file that builds changed"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "nothing to check: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$reason" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

  # Every player page against the schema and rules the site builds it with,
  # from the site's own checker, so the two never disagree. The site stays at
  # one commit, which Renovate moves.
  pages:
    needs: scope
    if: needs.scope.outputs.pages == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/docs
          ref: cf21b80043897a130d078ce71527702ff502c7bc # main
          path: .site
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # No lifecycle scripts: the site's only one installs git hooks.
      - name: Install the site's packages
        working-directory: .site
        run: bun install --frozen-lockfile --ignore-scripts --production

      - name: Check the player pages
        run: bun .site/tools/check-player-page.ts ./*/docs/player*.md

  rust:
    needs: scope
    if: needs.scope.outputs.skip == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing persists between jobs: the toolchain, the Windows SDK and the
      # apt packages come from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # The Windows SDK and CRT cargo-xwin downloads for the Windows lint,
      # about 12 minutes from Microsoft on a hosted runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-${{ runner.os }}-0.23.1-v1
      # clang of the toolchain's LLVM.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/apt-archives
          key: apt-${{ runner.os }}-v1

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-machete@0.9.2
          ast-grep: true
          gh: ${{ startsWith(github.head_ref || github.ref_name, 'release-plz-') }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          # Branch caches would fill the repository's cache storage and evict
          # the entries main's runs and pull requests restore.
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # The job `windows` runs the Windows-only crates' tests, not Wine here.
      - name: cargo xtask check
        run: |
          if [ "$FULL" = true ]; then
            cargo xtask check --all --no-wine
          else
            cargo fmt --all --check
            cargo xtask check
          fi

      # A release pull request merges only once `release` would take its
      # notes, choosing the mods as it does: each bumped mod's section
      # closed, a version tagged without its files finished from its tag,
      # every other mod built for the pinned loader, the platform on a
      # loader alpha.
      - name: Notes of the mods to release
        if: startsWith(github.head_ref || github.ref_name, 'release-plz-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask notes --unfinished

  # The tests of the crates marked `windows-only`, natively on Windows.
  windows:
    needs: scope
    if: needs.scope.outputs.skip == ''
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: windows
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # jq and cargo end lines with CRLF on Windows.
      - name: Windows tests to run
        id: list
        run: |
          tests=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.metadata.xtask["windows-only"] == true) | .name' | tr -d '\r' | xargs)
          echo "Windows tests: ${tests:-none}"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      # One test thread: the hook and patch tests share the process.
      - name: Windows tests
        if: steps.list.outputs.tests != ''
        env:
          TESTS: ${{ steps.list.outputs.tests }}
        run: |
          packages=()
          for package in $TESTS; do packages+=(-p "$package"); done
          status=0
          cargo test --target x86_64-pc-windows-msvc "${packages[@]}" -- --test-threads 1 || status=$?
          if [ "$status" != 0 ]; then
            # A crash takes the harness's buffered output with it: run the
            # library tests one by one to name the ones that crash.
            echo "::group::Each test alone"
            for package in $TESTS; do
              cargo test --quiet --target x86_64-pc-windows-msvc -p "$package" --lib -- --list --format terse |
                tr -d '\r' | sed -n 's/: test$//p' > "$RUNNER_TEMP/tests.txt"
              exe=$(cargo test --no-run --message-format json --target x86_64-pc-windows-msvc -p "$package" --lib |
                grep '"test":true' | grep -o '"executable":"[^"]*"' | head -1 | sed 's/^"executable":"//; s/"$//; s/\\\\/\//g')
              while read -r name; do
                "$exe" --exact "$name" --test-threads 1 > /dev/null 2>&1 || echo "::error::$package: crashed or failed alone: $name"
              done < "$RUNNER_TEMP/tests.txt"
            done
            echo "::endgroup::"
          fi
          exit "$status"

  # The required check: every part passed, or there was nothing to prove.
  check:
    needs: [scope, pages, rust, windows]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Result
        env:
          SCOPE: ${{ needs.scope.result }}
          PAGES: ${{ needs.pages.result }}
          RUST: ${{ needs.rust.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "scope: $SCOPE, player pages: $PAGES, rust: $RUST, Windows tests: $WINDOWS"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$SCOPE" = success ] && ok "$PAGES" && ok "$RUST" && ok "$WINDOWS"
