# The merge gate: check.yml, whose job `check` is the required check.
name: ci

on:
  # A draft runs nothing; marking it ready runs the check.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Only a pull request's newer push cancels its older run: a run on main
  # fills the caches pull requests start from and must finish.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped here, a draft reports no `ci / check` at all: a passing one would
  # still count once the pull request is marked ready, before the ready run's
  # own check exists, and on a re-run of the draft's run.
  ci:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
