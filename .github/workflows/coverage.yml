name: coverage

on:
  push:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/texts.toml"
      - "**/*.luau"
      - "!fuzz/**"
      - "!tools/**"
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - .config/nextest.toml
      - codecov.yml
      - .github/workflows/coverage.yml
      - .github/actions/setup-rust/**
  # Tries a change to this workflow on its branch, since pull requests never run it.
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/apt-archives
          key: apt-${{ runner.os }}-v1

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-nextest@0.9.151,cargo-llvm-cov@0.9.1

      # No build cache: the instrumented build shares nothing with the check's.
      - name: Host tests under coverage
        run: |
          rustup component add llvm-tools
          windows_only=$(cargo metadata --no-deps --format-version 1 | jq -r \
            '.packages[] | select(.metadata.xtask["windows-only"] == true) | .name')
          args=(--workspace --exclude xtask)
          for package in $windows_only; do
            args+=(--exclude "$package")
          done
          cargo llvm-cov nextest "${args[@]}" --no-tests=pass --lcov --output-path target/lcov.info

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: target/lcov.info
          retention-days: 1

  # Only this job can ask for an OIDC token, and it runs no code of the repository.
  upload:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov

      # Coverage only informs: a Codecov outage leaves main green.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false
