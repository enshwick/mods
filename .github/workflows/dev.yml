# The rolling `dev` prerelease, every night, until the first public release,
# 1.0.0: `cargo xtask dist` builds every mod at once on a fresh GitHub-hosted
# runner, and each mod's `<package>.zip`, PDB and SBOM replace the files of
# `dev`, whose tag moves to the commit. A night on which `dev` already holds
# main builds nothing. A run by hand, or a change to this workflow or the
# files action, builds at once. Then the docs site rebuilds.
name: dev

on:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/dev.yml
      - .github/actions/release-files/**
  workflow_dispatch:

permissions: {}

# One build at a time, never cut off half way through replacing the files.
concurrency:
  group: dev
  cancel-in-progress: false

jobs:
  dev:
    # Only main moves the public tag and saves the Windows SDK; a run by hand
    # from another branch does nothing.
    if: github.ref == 'refs/heads/main'
    # A fresh machine: what ships is built and published without the caches
    # that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      # The build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Whether dev is behind main
        id: behind
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha 2> /dev/null || true)
          if [ "$EVENT" = schedule ] && [ "$current" = "$GITHUB_SHA" ]; then
            echo "dev already holds $GITHUB_SHA: nothing to build" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The Windows SDK and CRT that cargo-xwin downloads, 7 to 9 minutes
      # from Microsoft on a hosted runner. Microsoft's files only, no build
      # output, under a key of their own that only a build of main saves.
      - name: Restore the Windows SDK
        if: steps.behind.outputs.build == 'true'
        id: xwin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1
      - if: steps.behind.outputs.build == 'true'
        uses: ./.github/actions/setup-rust
        with:
          gh: true
          tools: cargo-cyclonedx@0.5.9,cargo-auditable@0.7.7

      - if: steps.behind.outputs.build == 'true'
        uses: ./.github/actions/release-files
        with:
          out: ${{ runner.temp }}/dev

      - name: Save the Windows SDK
        if: steps.behind.outputs.build == 'true' && steps.xwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1

      - name: Build provenance
        if: steps.behind.outputs.build == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dev/*

      # GITHUB_TOKEN cannot move a tag past a commit that changes a workflow:
      # the enshwick-ci app can. It also starts the docs site's build.
      - name: Token for the release and the docs site
        if: steps.behind.outputs.build == 'true'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},docs
          permission-contents: write
          permission-workflows: write
          permission-actions: write

      - name: Publish
        if: steps.behind.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        working-directory: ${{ runner.temp }}/dev
        run: |
          short=$(git -C "$GITHUB_WORKSPACE" rev-parse --short=7 HEAD)
          title="Dev $short"
          notes="Development build of every mod at $GITHUB_SHA: $(git -C "$GITHUB_WORKSPACE" log -1 --format=%s).

          Until the first public release, 1.0.0, this prerelease is the build to download; every night that main changed replaces it. Extract a mod's zip into the folder that holds enshrouded.exe or enshrouded_server.exe. Each mod needs the Enshwick loader from enshwick.zip in the same folder."
          assets=(*.zip *.pdb *.cdx.json)
          if gh release view dev --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit dev --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease --latest=false
            gh release upload dev "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            # Files of an earlier build that this one no longer has, such as
            # the archive of a mod that was removed, go.
            gh release view dev --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do
                case " ${assets[*]} " in
                  *" $name "*) ;;
                  *) gh release delete-asset dev "$name" --yes --repo "$GITHUB_REPOSITORY" ;;
                esac
              done
          else
            # A tag left without its release moves too; gh would build on it as it is.
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" > /dev/null 2>&1; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            fi
            gh release create dev "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --prerelease --latest=false
          fi

      # The site shows each mod's page and its dev download.
      - name: Start the docs site build
        if: steps.behind.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY_OWNER/docs" --ref main
