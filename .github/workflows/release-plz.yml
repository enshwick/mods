# Release pull requests and releases with release-plz (release-plz.toml), run
# by hand on main only. `release-pr` opens or updates the release pull
# request, which bumps only the mods whose folders changed.
# `release`, after that pull request merged, tags each released mod
# `<package>-v<version>` and makes its own GitHub release; then one job per
# released mod builds only that mod from its tag and attaches its zip, PDB,
# SBOM, their sums and a build provenance attestation of each, which players
# check with `gh attestation verify <file> --owner enshwick`. Last, on
# Windows, each attached DLL must report the version of its tag.
name: release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr

permissions: {}

jobs:
  release-plz:
    # Releases come only from main; the build jobs need this one.
    if: github.ref == 'refs/heads/main'
    # A fresh machine: what ships is built and published without the caches
    # that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: release-plz
      cancel-in-progress: false
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The app pushes the release branch and tags, makes the releases and
      # opens the release pull request, which then runs CI as any other; the
      # job token may not open pull requests.
      - name: Token for the release
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - id: release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

  assets:
    needs: release-plz
    if: inputs.command == 'release' && needs.release-plz.outputs.releases != '' && needs.release-plz.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-plz.outputs.releases) }}
    # A fresh machine, as above.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ matrix.release.tag }}
      PACKAGE: ${{ matrix.release.package_name }}
    steps:
      - name: Where the files go
        run: echo "OUT=$RUNNER_TEMP/release" >> "$GITHUB_ENV" # zizmor: ignore[github-env] a fixed path

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release.tag }}
          persist-credentials: false

      # Only the Windows SDK files that a build of main saved (dev.yml).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1
      - uses: ./.github/actions/setup-rust
        with:
          gh: true
          tools: cargo-cyclonedx@0.5.9,cargo-auditable@0.7.7

      - uses: ./.github/actions/release-files
        with:
          packages: ${{ matrix.release.package_name }}
          out: ${{ env.OUT }}

      - name: Sums
        working-directory: ${{ env.OUT }}
        run: |
          files=("$PACKAGE.zip" "$PACKAGE.pdb" "$PACKAGE.cdx.json")
          sha256sum "${files[@]}" > SHA256SUMS
          {
            echo "### Release files of $TAG"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            for file in "${files[@]}" SHA256SUMS; do
              echo "| $file | $(stat -c %s "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.OUT }}/*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.OUT }}
        run: gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"

  # The DLL attached to each release reports its tag's version, read through
  # its manifest as the loader reads it, which needs Windows.
  version:
    needs: [release-plz, assets]
    if: inputs.command == 'release' && needs.release-plz.outputs.releases != '' && needs.release-plz.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-plz.outputs.releases) }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ matrix.release.tag }}
      PACKAGE: ${{ matrix.release.package_name }}
      VERSION: ${{ matrix.release.version }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release.tag }}
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc --version

      # The CLI of the platform commit the mod was built on.
      - name: Install cargo-enshwick
        run: |
          rev=$(sed -n 's/^enshwick = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          cargo install --locked --git https://github.com/enshwick/enshwick --rev "$rev" cargo-enshwick

      - name: The released DLL's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PACKAGE.zip" --dir "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP/release" "$RUNNER_TEMP/$PACKAGE.zip" > /dev/null
          cargo enshwick manifest "$RUNNER_TEMP/release/mods/$PACKAGE.dll" --expect-version "$VERSION"
