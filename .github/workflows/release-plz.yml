# Release pull requests and releases with release-plz (release-plz.toml), run
# by hand. Until 1.0 each release is an alpha, a GitHub prerelease.
# `release-pr`, on main, opens or updates the release pull request, which
# bumps the mods of the release set (the entries of release-plz.toml without
# `release = false`) whose folders changed (`cargo xtask pin` changes the
# folder of each of them when the loader moves), then closes each bumped
# mod's changelog on its branch with `cargo xtask close`, so it is ready to
# merge. `release`, on main, releases every mod of the set whose version has
# no finished
# release yet: it refuses before tagging anything when a mod's notes are not
# ready, then release-plz tags each new version `<package>-v<version>`, and
# each such mod gets its prerelease with the notes of `cargo xtask notes`,
# also when release-plz tagged it and stopped, so running `release` again
# finishes a run that stopped partway; one job per released mod builds only
# that mod from its tag and attaches its zip, PDB, SBOM, their sums and a
# build provenance attestation of each, which players check with
# `gh attestation verify <file> --owner enshwick`. On Windows each attached DLL must report the version
# of its tag, and the docs site builds again for the new downloads. `build`,
# from any branch, writes the notes and builds the files a release would, and
# publishes nothing.
name: release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - build
          - release-pr
          - release
        default: build

permissions: {}

jobs:
  release-plz:
    # Releases come only from main; the build jobs need this one.
    if: github.ref == 'refs/heads/main' && inputs.command != 'build'
    # The release environment admits main only.
    environment: release
    # A fresh machine: what ships is built and published without the caches
    # that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: release-plz
      cancel-in-progress: false
    outputs:
      releases: ${{ steps.finish.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          gh: true

      # A release goes out with its notes or not at all: a mod with changes
      # still under Unreleased, a released mod built for another loader, or
      # a platform pin no loader alpha tags, stops the run before anything is
      # tagged. A mod tagged by a run that stopped partway is taken again.
      - name: Notes of the mods to release
        if: inputs.command == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask notes --unfinished --out "$RUNNER_TEMP/notes"

      # The app pushes the release branch and tags, makes the releases and
      # opens the release pull request, which then runs CI as any other; the
      # job token may not open pull requests.
      - name: Token for the release
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # On `release` it only pushes the tags (release-plz.toml); the next
      # step makes the releases.
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      # Every mod with notes gets its release with them, or its notes when a
      # stopped run made it: GitHub answered 422 to a release made right
      # after its tag was pushed, so a refused one is tried again.
      - name: Finish the releases
        id: finish
        if: inputs.command == 'release'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          notes="$RUNNER_TEMP/notes"
          list="$notes/releases.json"
          mkdir -p "$notes"
          [ -f "$list" ] || echo '[]' > "$list"
          jq -r '.[] | [.tag, .package_name, .title] | @tsv' "$list" | while IFS=$'\t' read -r tag package title; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes/$package.md"
              continue
            fi
            for attempt in 1 2 3 4 5; do
              if gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
                --title "$title" --notes-file "$notes/$package.md"; then
                break
              fi
              [ "$attempt" -lt 5 ] || exit 1
              sleep $((attempt * 10))
            done
          done
          echo "releases=$(jq -c . "$list")" >> "$GITHUB_OUTPUT"

      # The bumped mods' changelogs closed on the release pull request's
      # branch, as its CI and `release` need them, by the app, so release-plz
      # still updates that pull request on its next run; its body then lists
      # what the pull request releases.
      - name: Close the changelogs
        if: inputs.command == 'release-pr' && steps.release-plz.outputs.pr != '' && steps.release-plz.outputs.pr != '{}'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.release-plz.outputs.pr }}
          APP: ${{ steps.token.outputs.app-slug }}
        run: |
          branch=$(jq -r .head_branch <<< "$PR")
          number=$(jq -r .number <<< "$PR")
          git fetch --no-tags origin "refs/heads/$branch"
          git checkout -B "$branch" FETCH_HEAD
          cargo xtask close --date "$(date -u +%F)" --base origin/main --body "$RUNNER_TEMP/body.md"
          if ! git diff --quiet; then
            id=$(gh api "/users/$APP%5Bbot%5D" --jq .id)
            git -c user.name="${APP}[bot]" -c user.email="$id+${APP}[bot]@users.noreply.github.com" \
              commit -a -m "chore(release): close the changelogs of the released mods"
            git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          fi
          gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"

  assets:
    needs: release-plz
    if: inputs.command == 'release' && needs.release-plz.outputs.releases != '' && needs.release-plz.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-plz.outputs.releases) }}
    # A fresh machine, as above.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ matrix.release.tag }}
      PACKAGE: ${{ matrix.release.package_name }}
      # The files the build writes, as `cargo xtask notes` lists them, and the
      # file summing them; a finished release has all of them.
      FILES: ${{ join(matrix.release.files, ' ') }}
      SUMS: ${{ matrix.release.sums }}
    steps:
      - name: Where the files go
        run: echo "OUT=$RUNNER_TEMP/release" >> "$GITHUB_ENV" # zizmor: ignore[github-env] a fixed path

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release.tag }}
          persist-credentials: false

      # The Windows SDK and CRT that cargo-xwin downloads, 7 to 9 minutes
      # from Microsoft on a hosted runner: Microsoft's files only, no build
      # output, under a key of their own that only a release from main saves.
      - name: Restore the Windows SDK
        id: xwin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1
      - uses: ./.github/actions/setup-rust
        with:
          gh: true
          tools: cargo-cyclonedx@0.5.10,cargo-auditable@0.7.7

      - uses: ./.github/actions/release-files
        with:
          packages: ${{ matrix.release.package_name }}
          out: ${{ env.OUT }}

      # Beside other mods' jobs only the first save wins, which is enough.
      - name: Save the Windows SDK
        if: steps.xwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1

      - name: Sums
        working-directory: ${{ env.OUT }}
        run: |
          read -ra files <<< "$FILES"
          sha256sum "${files[@]}" > "$SUMS"
          {
            echo "### Release files of $TAG"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            for file in "${files[@]}" "$SUMS"; do
              echo "| $file | $(stat -c %s "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.OUT }}/*

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.OUT }}
        run: |
          read -ra files <<< "$FILES"
          gh release upload "$TAG" "${files[@]}" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"

  # The DLL attached to each release reports its tag's version, read through
  # its manifest as the loader reads it, which needs Windows.
  version:
    needs: [release-plz, assets]
    if: inputs.command == 'release' && needs.release-plz.outputs.releases != '' && needs.release-plz.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-plz.outputs.releases) }}
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ matrix.release.tag }}
      PACKAGE: ${{ matrix.release.package_name }}
      VERSION: ${{ matrix.release.version }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release.tag }}
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc --version

      # The CLI of the platform commit the mod was built on.
      - name: Install cargo-enshwick
        run: |
          rev=$(sed -n 's/^enshwick = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' Cargo.toml)
          test -n "$rev"
          cargo install --locked --git https://github.com/enshwick/enshwick --rev "$rev" cargo-enshwick

      - name: The released DLL's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PACKAGE.zip" --dir "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP/release" "$RUNNER_TEMP/$PACKAGE.zip" > /dev/null
          # The archive holds one mod folder, mods/<id>/, named by the mod's id.
          dlls=("$RUNNER_TEMP"/release/mods/*/"$PACKAGE.dll")
          test "${#dlls[@]}" -eq 1 && test -f "${dlls[0]}"
          cargo enshwick manifest "${dlls[0]}" --expect-version "$VERSION"

  # The site links each mod's newest release, read when it builds. It builds
  # on Cloudflare Workers Builds, whose deploy hook builds its main again.
  site:
    needs: [release-plz, assets]
    if: inputs.command == 'release' && needs.release-plz.outputs.releases != '' && needs.release-plz.outputs.releases != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Start the docs site build
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error --retry 3 -X POST "$DOCS_DEPLOY_HOOK"

  # What `release` would ship, from any branch, published nowhere: the notes
  # of every mod whose version has no tag yet and their files, or every mod's
  # files when a mod's notes are refused, so the build is checked even then;
  # the run fails on refused notes after it shows them.
  build:
    if: inputs.command == 'build'
    # A fresh machine, as above, without the release environment's secrets.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1
      - uses: ./.github/actions/setup-rust
        with:
          gh: true
          tools: cargo-cyclonedx@0.5.10,cargo-auditable@0.7.7

      - name: Notes
        id: notes
        continue-on-error: true
        run: |
          cargo xtask notes --unreleased --out "$RUNNER_TEMP/notes"
          packages=$(find "$RUNNER_TEMP/notes" -name '*.md' -printf '%f\n' 2> /dev/null | sed 's/\.md$//' | sort | tr '\n' ' ')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/release-files
        with:
          packages: ${{ steps.notes.outputs.packages }}
          out: ${{ runner.temp }}/release

      - name: Summary
        env:
          NOTES: ${{ steps.notes.outcome }}
        run: |
          {
            echo "### Files a release would attach"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | ---: | --- |"
            for file in "$RUNNER_TEMP"/release/*; do
              echo "| $(basename "$file") | $(stat -c %s "$file") | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            for notes in "$RUNNER_TEMP"/notes/*.md; do
              [ -f "$notes" ] || continue
              echo
              echo "### Notes of $(basename "$notes" .md)"
              echo
              cat "$notes"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NOTES" != success ]; then
            echo "::error title=notes::cargo xtask notes refused a mod; its log says why"
            exit 1
          fi
