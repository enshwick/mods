[workspace]
members = [
    "admin-tools",
    "area-loot",
    "better-altars",
    "build-camera",
    "game-rates",
    "optimizer",
    "personal-safes",
    "shared-experience",
    "survivors-per-altar",
    "devtools/enshwick-probe",
    "devtools/enshwick-research",
    "devtools/enshwick-test-content",
    "devtools/enshwick-test-ui",
    "tools/xtask",
]
resolver = "3"

# The loader release the next release of the mods builds on and `release`
# pins: `cargo xtask built-for` names it in the release pull request.
[workspace.metadata.release]
loader = "v1.0.0-alpha.15"

[workspace.dependencies]
# The platform from git, at a commit of its main branch.
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "c31bc25f6d9cfd8f9182406b971fc0da3551c93e" }
enshwick-gamedata = { git = "https://github.com/enshwick/enshwick", rev = "c31bc25f6d9cfd8f9182406b971fc0da3551c93e" }
enshwick-luau = { git = "https://github.com/enshwick/enshwick", rev = "c31bc25f6d9cfd8f9182406b971fc0da3551c93e" }
# The crate rules and changelog reader the tasks share with the platform's.
cargo-enshwick = { git = "https://github.com/enshwick/enshwick", rev = "c31bc25f6d9cfd8f9182406b971fc0da3551c93e", default-features = false }

# What more than one package takes, each at one version; a member adds the
# features it needs.
arc-swap = { version = "1.9.3", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
toml = { version = "=1.2.1", default-features = false, features = ["std"] }
windows-sys = { version = "0.61.2", default-features = false }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
missing_abi = "deny"
non_ascii_idents = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unexpected_cfgs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# cargo-deny owns duplicate versions.
multiple_crate_versions = "allow"
# Its fix, `assert_eq!(value, [] as [T; 0])`, reads worse than `is_empty()`,
# and the test name already says what was expected.
assert_is_empty = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding stays on: every detour catches panics and falls back to vanilla.
panic = "unwind"
debug = "line-tables-only"
strip = "none"
