[package]
name = "enshwick-admin-tools"
version = "0.0.0-dev"
description = "Gives a server's administrators a player list, bans, an allow-list, announcements, time and weather, teleports, items, chests, inventories, vitals, recipes, god mode, backups, a remote console and audit and chat logs"
keywords = ["enshrouded", "mod", "admin", "server", "moderation"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/admin-tools"
publish = false

[package.metadata.enshwick]
id = "enshwick.admin-tools"
side = "server"
name = "Admin Tools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap.workspace = true
enshwick = { workspace = true, features = ["unstable"] }
getrandom = { version = "0.4.3", default-features = false }
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
toml = { workspace = true, features = ["serde", "display"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
proptest.workspace = true
toml = { workspace = true, features = ["serde", "display", "parse"] }

[lints]
workspace = true
