[package]
name = "enshwick-admin-tools"
version = "0.0.0-dev"
description = "Gives a server's administrators a player list, bans, an allow-list, announcements, time and weather, teleports and an audit log"
keywords = ["enshrouded", "mod", "admin", "server", "moderation"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/admin-tools"
publish = false

[package.metadata.enshwick]
id = "enshwick.admin-tools"
side = "server"
name = "Admin Tools"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap = { version = "1.9.3", default-features = false }
enshwick = { workspace = true, features = ["unstable"] }
rustc-hash.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "display"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "serde", "display", "parse"] }

[lints]
workspace = true
