[pl]
"mod.name" = "Admin Tools"
"mod.description" = "Daje administratorom serwera listę graczy, wyrzucanie, bany, listę dopuszczonych, wyciszanie na czacie, ogłoszenia, ostrzeżenia o restarcie, porę dnia i pogodę, leczenie, teleportacje, przedmioty i skrzynie przedmiotów, ekwipunki, zdrowie, wytrzymałość i manę, receptury, tryb boga, zapisy i kopie zapasowe, konsolę zdalną oraz dzienniki działań i czatu."
"action.online" = "Gracze online"
"action.online.help" = "Każdy gracz online, z jego czasem online i tym, czy jest wyciszony."
"action.motd" = "Wiadomość dnia"
"action.motd.help" = "Co gracze czytają po dołączeniu: wiadomość ustawiona w grze, a jeśli jej nie ma, ta z ustawień świata."
"action.kick" = "Wyproś"
"action.kick.help" = "Usuwa gracza z gry. Może dołączyć ponownie."
"action.banned" = "Zbanowani"
"action.banned.help" = "Banuje gracza, online lub nieobecnego, albo zdejmuje bana. Ban obowiązuje, gdy konto wraca, także po restarcie."
"action.allowed" = "Lista dopuszczonych"
"action.allowed.help" = "Gdy lista dopuszczonych jest włączona w ustawieniach świata, dołączać mogą tylko te konta i administratorzy."
"action.muted" = "Wyciszeni na czacie"
"action.muted.help" = "Wiadomości wyciszonego gracza nie docierają do nikogo. Administratorzy i gospodarz nigdy nie są wyciszeni."
"action.heal" = "Ulecz"
"action.heal.help" = "Przywraca graczowi pełne zdrowie."
"action.stats" = "Ustaw zdrowie, wytrzymałość, manę lub poziom"
"action.stats.help" = "Ustawia zdrowie, wytrzymałość lub manę gracza na wartość, którą gra utrzymuje w granicach maksimum, albo jego poziom, który gra ustawia w następnym kroku."
"action.revive" = "Wskrześ"
"action.revive.help" = "Wskrzesza martwego gracza tam, gdzie leży, z pełnym zdrowiem, bez odrodzenia."
"action.learn" = "Naucz receptury"
"action.learn.help" = "Odblokowuje graczowi recepturę wskazaną nazwą z gry, np. Tool_Torch01, jej GUID lub identyfikatorem zawartości moda; albo daje dowolną wiedzę według jej numeru."
"action.god" = "Tryb boga"
"action.god.help" = "W trybie boga nic nie zadaje graczowi obrażeń. Tryb kończy się, gdy gracz wychodzi lub świat się zatrzymuje."
"action.chest" = "Skrzynia przedmiotów przy graczu"
"action.chest.help" = "Stawia drewnianą skrzynię obok gracza i napełnia ją przedmiotami, wskazanymi jak przy dawaniu. Skrzynia poza każdą bazą nie jest zapisywana."
"action.chestat" = "Skrzynia przedmiotów w miejscu"
"action.chestat.help" = "Stawia drewnianą skrzynię w miejscu i napełnia ją przedmiotami, wskazanymi jak przy dawaniu. Skrzynia poza każdą bazą nie jest zapisywana."
"action.clear" = "Wyczyść ekwipunek"
"action.clear.help" = "Niszczy każdy stos w każdym miejscu gracza, łącznie z wyposażeniem, paskiem akcji i miejscami wyglądu."
"action.copy" = "Skopiuj ekwipunek"
"action.copy.help" = "Daje drugiemu graczowi nowe przedmioty z każdego stosu, który pierwszy nosi lub ma na sobie. Przedmioty są nowe, bez zużycia i poziomu; co się nie mieści, zostaje pominięte, a miejsca wyglądu i waluty nie są kopiowane."
"action.give" = "Daj przedmiot"
"action.give.help" = "Daje graczowi nowe przedmioty, jeden, gdy liczba jest pominięta, w tylu stosach, ile trzeba. Okno pokazuje przedmioty pod nazwami z twojej gry. Wpisane polecenie wskazuje przedmiot nazwą debugowania, np. Tool_Glider_T1, jego GUID lub identyfikatorem zawartości moda; w grze, której gospodarzem jest gracz, także nazwą pokazywaną przez grę, np. Lotnia."
"action.goto" = "Idź do gracza"
"action.goto.help" = "Przenosi cię do gracza."
"action.bring" = "Przywołaj gracza"
"action.bring.help" = "Przenosi gracza do ciebie."
"action.send" = "Wyślij gracza do innego"
"action.send.help" = "Przenosi pierwszego gracza do drugiego."
"action.place" = "Przenieś gracza w miejsce"
"action.place.help" = "Przenosi gracza w miejsce podane w metrach, na wolny teren w pobliżu."
"action.time" = "Pora dnia"
"action.time.help" = "Ustawia porę dnia: wpisz ją jako 18:30 lub w godzinach, np. 6.5 dla 06:30."
"action.weather" = "Pogoda"
"action.weather.help" = "Włącza wszędzie wybraną pogodę."
"action.restart" = "Ostrzeżenie o restarcie"
"action.restart.help" = "Ostrzega każdego gracza przed restartem za tyle minut i ponownie, gdy się zbliża. 0 kończy ostrzeżenie."
"action.audit" = "Dziennik działań"
"action.audit.help" = "Ostatnie działania administratorów, najnowsze na końcu."
"action.status" = "Stan serwera"
"action.status.help" = "Wersje Enshwick i modów, czas od uruchomienia serwera i świat."
"action.save" = "Zapisz teraz"
"action.save.help" = "Zapisuje świat teraz, tak jak robią to okresowe zapisy gry."
"action.backup" = "Kopia zapasowa świata"
"action.backup.help" = "Kopiuje zapis świata wraz z ustawieniami i danymi modów do folderu kopii nazwanego według czasu, podczas gdy serwer działa."
"action.world" = "Ustawienia świata"
"action.world.help" = "Świat, jego ostatni zapis i jego ustawienia gry."
"action.chat" = "Dziennik czatu"
"action.chat.help" = "Ostatnie wiadomości czatu, najnowsze na końcu."
