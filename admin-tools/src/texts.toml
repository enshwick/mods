[zh-cn]
"mod.name" = "Admin Tools"
"mod.description" = "为服务器管理员提供玩家列表、踢出、封禁、允许名单、聊天禁言、公告、重启警告、时间和天气、治疗、传送、物品和装满物品的箱子、物品栏、生命值、体力和法力、配方、无敌模式、保存和备份、远程控制台，以及审计日志和聊天日志。"
"action.online" = "在线玩家"
"action.online.help" = "每位在线玩家，以及其在线时长和是否被禁言。"
"action.motd" = "每日消息"
"action.motd.help" = "玩家加入时看到的内容：游戏中设置的消息，没有则用世界设置中的消息。"
"action.kick" = "踢出"
"action.kick.help" = "将玩家移出游戏。对方可以再次加入。"
"action.banned" = "封禁"
"action.banned.help" = "封禁一名在线或不在线的玩家，或解除封禁。账户回来时封禁依然有效，重启后也是。"
"action.allowed" = "允许名单"
"action.allowed.help" = "世界设置中允许名单开启时，只有这些账户和管理员可以加入。"
"action.muted" = "聊天禁言"
"action.muted.help" = "被禁言玩家的聊天消息不会送达任何人。管理员和主机永远不会被禁言。"
"action.heal" = "治疗"
"action.heal.help" = "让玩家的生命值回满。"
"action.stats" = "设置生命值、体力、法力或等级"
"action.stats.help" = "将玩家的生命值、体力或法力设为一个值，游戏会将其限制在最大值以内；或设置其等级，游戏会在下一步生效。"
"action.revive" = "复活"
"action.revive.help" = "让死亡的玩家在倒下的地方以满生命值复活，不会重生。"
"action.learn" = "传授配方"
"action.learn.help" = "为玩家解锁一个配方，用游戏中的名称（如 Tool_Torch01）、GUID 或模组的内容 ID 指定；也可按编号授予任意知识。"
"action.god" = "无敌模式"
"action.god.help" = "无敌模式下，任何东西都不会对玩家造成伤害。玩家离开或世界停止时结束。"
"action.chest" = "在玩家旁放置物品箱"
"action.chest.help" = "在玩家旁边放一个木箱子并装入物品，物品的指定方式与给予物品相同。不在任何基地内的箱子不会被保存。"
"action.chestat" = "在指定位置放置物品箱"
"action.chestat.help" = "在指定位置放一个木箱子并装入物品，物品的指定方式与给予物品相同。不在任何基地内的箱子不会被保存。"
"action.clear" = "清空物品栏"
"action.clear.help" = "销毁玩家每个栏位中的每一堆物品，包括装备、动作栏和外观栏位。"
"action.copy" = "复制物品栏"
"action.copy.help" = "按第一位玩家携带或穿戴的每一堆物品，给第二位玩家全新的物品。物品为全新，没有磨损和等级；放不下的会被略去，外观栏位和货币栏位不会被复制。"
"action.give" = "给予物品"
"action.give.help" = "给玩家全新的物品，不写数量时为一个，按需分成多堆。窗口按你的游戏显示的名称列出物品。输入的命令用调试名称（如 Tool_Glider_T1）、GUID 或模组的内容 ID 指定物品；在玩家主持的游戏中，也可以用游戏显示的名称，如 滑翔翼。"
"action.goto" = "前往玩家处"
"action.goto.help" = "把你带到一名玩家身边。"
"action.bring" = "召来玩家"
"action.bring.help" = "把一名玩家带到你身边。"
"action.send" = "把玩家送到另一名玩家处"
"action.send.help" = "把第一位玩家移到第二位玩家身边。"
"action.place" = "把玩家移到指定位置"
"action.place.help" = "把玩家移到以米为单位的位置附近的空地上。"
"action.time" = "时间"
"action.time.help" = "设置一天中的时间：写成 18:30，或写成小时数，如 6.5 表示 06:30。"
"action.weather" = "天气"
"action.weather.help" = "在所有地方开始你选择的天气。"
"action.restart" = "重启警告"
"action.restart.help" = "提醒每位玩家服务器将在这么多分钟后重启，并在临近时再次提醒。0 停止警告。"
"action.audit" = "审计日志"
"action.audit.help" = "最近的管理操作，最新的在最后。"
"action.status" = "服务器状态"
"action.status.help" = "Enshwick 和模组的版本、服务器启动以来的时间和世界。"
"action.save" = "立即保存"
"action.save.help" = "像游戏的定时存档那样，立即保存世界。"
"action.backup" = "备份世界"
"action.backup.help" = "在服务器运行时，把世界的存档连同模组设置和数据复制到以时间命名的备份文件夹。"
"action.world" = "世界设置"
"action.world.help" = "世界、最后一次存档和游戏设置。"
"action.chat" = "聊天日志"
"action.chat.help" = "最近的聊天消息，最新的在最后。"
