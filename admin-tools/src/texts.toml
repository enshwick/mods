[uk]
"mod.name" = "Admin Tools"
"mod.description" = "Дає адміністраторам сервера список гравців, вигнання, бани, список дозволених, вимкнення чату, оголошення, попередження про перезапуск, час і погоду, лікування, телепорти, предмети й скрині з предметами, інвентарі, здоров'я, витривалість і ману, рецепти, режим бога, збереження й резервні копії, віддалену консоль, журнал дій і журнал чату."
"action.online" = "Гравці в мережі"
"action.online.help" = "Кожен гравець у мережі, скільки він у грі і чи вимкнено йому чат."
"action.motd" = "Повідомлення дня"
"action.motd.help" = "Що гравці читають, коли заходять: повідомлення, задане в грі, інакше те, що в налаштуваннях світу."
"action.kick" = "Вигнати"
"action.kick.help" = "Прибирає гравця з гри. Він може зайти знову."
"action.banned" = "Забанені"
"action.banned.help" = "Банить гравця, у мережі чи ні, або знімає бан. Бан діє, коли акаунт повертається, і після перезапуску."
"action.allowed" = "Список дозволених"
"action.allowed.help" = "Поки список дозволених увімкнено в налаштуваннях світу, заходити можуть лише ці акаунти й адміністратори."
"action.muted" = "Чат вимкнено"
"action.muted.help" = "Рядки гравця з вимкненим чатом не бачить ніхто. Адміністраторам і хосту чат не вимикається."
"action.heal" = "Вилікувати"
"action.heal.help" = "Повертає гравцю повне здоров'я."
"action.stats" = "Здоров'я, витривалість, мана, рівень"
"action.stats.help" = "Встановлює гравцю здоров'я, витривалість або ману, які гра тримає в межах максимуму, або рівень, який гра встановлює на наступному кроці."
"action.revive" = "Воскресити"
"action.revive.help" = "Воскрешає загиблого гравця там, де він лежить, з повним здоров'ям, без відродження."
"action.uncover" = "Відкрити мапу"
"action.uncover.help" = "Відкриває всю мапу гравця в мережі, ніби він дослідив її всю. Його гра має працювати з Enshwick."
"action.learn" = "Навчити рецепта"
"action.learn.help" = "Відкриває гравцю рецепт, названий назвою в грі, наприклад Tool_Torch01, його GUID або ідентифікатором вмісту мода; або дає будь-яке знання за номером."
"action.god" = "Режим бога"
"action.god.help" = "Гравця в режимі бога ніщо не ранить. Режим закінчується, коли гравець виходить або світ зупиняється."
"action.chest" = "Скриня з предметами біля гравця"
"action.chest.help" = "Ставить дерев'яну скриню біля гравця й наповнює її предметами, названими як для видачі. Скриня поза базами не зберігається."
"action.chestat" = "Скриня з предметами в точці"
"action.chestat.help" = "Ставить дерев'яну скриню в точці й наповнює її предметами, названими як для видачі. Скриня поза базами не зберігається."
"action.clear" = "Очистити інвентар"
"action.clear.help" = "Знищує кожен стос у кожному слоті гравця, разом зі спорядженням, панеллю дій і слотами вигляду."
"action.copy" = "Скопіювати інвентар"
"action.copy.help" = "Дає другому гравцю нові предмети з кожного стосу, який перший несе або носить. Предмети нові, без зносу й рівня; те, що не влізло, не дається, а слоти вигляду й валюти не копіюються."
"action.give" = "Дати предмет"
"action.give.help" = "Дає гравцю нові предмети, один, якщо кількість не вказано, у стількох стосах, скільки треба. Вікно показує предмети назвами з твоєї гри. У команді назви предмет його налагоджувальною назвою, наприклад Tool_Glider_T1, його GUID або ідентифікатором вмісту мода; у грі, яку проводить гравець, також назвою, яку показує гра, наприклад Параплан."
"action.goto" = "До гравця"
"action.goto.help" = "Переносить тебе до гравця."
"action.bring" = "Привести гравця"
"action.bring.help" = "Переносить гравця до тебе."
"action.send" = "Відправити гравця до іншого"
"action.send.help" = "Переносить першого гравця до другого."
"action.place" = "Перенести гравця в точку"
"action.place.help" = "Переносить гравця в точку в метрах, на вільне місце поруч із нею."
"action.time" = "Час доби"
"action.time.help" = "Задає час доби: пиши його як 18:30 або в годинах, наприклад 6.5 для 06:30."
"action.weather" = "Погода"
"action.weather.help" = "Запускає обрану погоду всюди."
"action.restart" = "Попередження про перезапуск"
"action.restart.help" = "Попереджає всіх гравців про перезапуск за стільки хвилин, і знову, коли він ближче. 0 зупиняє попередження."
"action.audit" = "Журнал дій"
"action.audit.help" = "Останні дії адміністраторів, найновіша в кінці."
"action.status" = "Стан сервера"
"action.status.help" = "Версії Enshwick і модів, час від запуску сервера і світ."
"action.save" = "Зберегти зараз"
"action.save.help" = "Зберігає світ зараз, як це роблять збереження гри за часом."
"action.backup" = "Резервна копія світу"
"action.backup.help" = "Копіює збереження світу з налаштуваннями й даними модів у теку резервних копій, названу за часом, поки сервер працює."
"action.world" = "Налаштування світу"
"action.world.help" = "Світ, його останнє збереження і налаштування гри."
"action.chat" = "Журнал чату"
"action.chat.help" = "Останні рядки чату, найновіший у кінці."
