[zh-tw]
"mod.name" = "Admin Tools"
"mod.description" = "為伺服器管理員提供玩家清單、踢出、封鎖、允許名單、聊天禁言、公告、重新啟動警告、時間與天氣、治療、傳送、物品與裝滿物品的箱子、背包、生命值、體力與法力、配方、無敵模式、存檔與備份、遠端主控台，以及稽核紀錄與聊天紀錄。"
"action.online" = "線上玩家"
"action.online.help" = "每位線上玩家，以及其上線時間與是否被禁言。"
"action.motd" = "每日訊息"
"action.motd.help" = "玩家加入時看到的內容：遊戲中設定的訊息，沒有則用世界設定中的訊息。"
"action.kick" = "踢出"
"action.kick.help" = "將玩家移出遊戲。對方可以再次加入。"
"action.banned" = "封鎖"
"action.banned.help" = "封鎖一名線上或離線的玩家，或解除封鎖。帳號回來時封鎖依然有效，重新啟動後也是。"
"action.allowed" = "允許名單"
"action.allowed.help" = "世界設定中允許名單開啟時，只有這些帳號與管理員可以加入。"
"action.muted" = "聊天禁言"
"action.muted.help" = "被禁言玩家的聊天訊息不會傳給任何人。管理員與主機永遠不會被禁言。"
"action.heal" = "治療"
"action.heal.help" = "讓玩家的生命值回滿。"
"action.stats" = "設定生命值、體力、法力或等級"
"action.stats.help" = "將玩家的生命值、體力或法力設為一個值，遊戲會將其限制在最大值以內；或設定其等級，遊戲會在下一步生效。"
"action.revive" = "復活"
"action.revive.help" = "讓死亡的玩家在倒下的地方以滿生命值復活，不會重生。"
"action.learn" = "傳授配方"
"action.learn.help" = "為玩家解鎖一個配方，用遊戲中的名稱（如 Tool_Torch01）、GUID 或模組的內容 ID 指定；也可依編號授予任何知識。"
"action.god" = "無敵模式"
"action.god.help" = "無敵模式下，任何東西都不會對玩家造成傷害。玩家離開或世界停止時結束。"
"action.chest" = "在玩家旁放置物品箱"
"action.chest.help" = "在玩家旁邊放一個木製箱子並裝入物品，物品的指定方式與給予物品相同。不在任何基地內的箱子不會被儲存。"
"action.chestat" = "在指定位置放置物品箱"
"action.chestat.help" = "在指定位置放一個木製箱子並裝入物品，物品的指定方式與給予物品相同。不在任何基地內的箱子不會被儲存。"
"action.clear" = "清空背包"
"action.clear.help" = "銷毀玩家每個欄位中的每一疊物品，包括裝備、動作列與外觀欄位。"
"action.copy" = "複製背包"
"action.copy.help" = "依第一位玩家攜帶或穿戴的每一疊物品，給第二位玩家全新的物品。物品為全新，沒有磨損與等級；放不下的會被略過，外觀欄位與貨幣欄位不會被複製。"
"action.give" = "給予物品"
"action.give.help" = "給玩家全新的物品，不寫數量時為一個，依需要分成多疊。視窗依你的遊戲顯示的名稱列出物品。輸入的指令用除錯名稱（如 Tool_Glider_T1）、GUID 或模組的內容 ID 指定物品；在玩家主持的遊戲中，也可以用遊戲顯示的名稱，如 滑翔翼。"
"action.goto" = "前往玩家處"
"action.goto.help" = "把你帶到一名玩家身邊。"
"action.bring" = "召來玩家"
"action.bring.help" = "把一名玩家帶到你身邊。"
"action.send" = "把玩家送到另一名玩家處"
"action.send.help" = "把第一位玩家移到第二位玩家身邊。"
"action.place" = "把玩家移到指定位置"
"action.place.help" = "把玩家移到以公尺為單位的位置附近的空地上。"
"action.time" = "時間"
"action.time.help" = "設定一天中的時間：寫成 18:30，或寫成小時數，如 6.5 表示 06:30。"
"action.weather" = "天氣"
"action.weather.help" = "在所有地方開始你選擇的天氣。"
"action.restart" = "重新啟動警告"
"action.restart.help" = "提醒每位玩家伺服器將在這麼多分鐘後重新啟動，並在接近時再次提醒。0 停止警告。"
