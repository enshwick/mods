[en]
"mod.name" = "Admin Tools"
"mod.description" = "Gives a server's administrators a player list, kicks, bans, an allow-list, chat mutes, announcements, restart warnings, time and weather, healing, teleports, items and chests of items, inventories, health, stamina and mana, recipes, god mode, saves and backups, a remote console, and audit and chat logs."
"action.online" = "Players online"
"action.online.help" = "Each player online, with their time online and whether they are muted."
"action.motd" = "Message of the day"
"action.motd.help" = "What players read when they join: the message set in game, else the one in the world's settings."
"action.kick" = "Kick"
"action.kick.help" = "Removes a player from the game. They may join again."
"action.banned" = "Banned"
"action.banned.help" = "Bans a player, online or away, or lifts a ban. A ban holds when the account comes back, also after a restart."
"action.allowed" = "Allow-list"
"action.allowed.help" = "While the allow-list is on in the world's settings, only these accounts and administrators may join."
"action.muted" = "Muted in chat"
"action.muted.help" = "A muted player's chat lines reach nobody. Administrators and the host are never muted."
"action.heal" = "Heal"
"action.heal.help" = "Gives a player their full health."
"action.stats" = "Set health, stamina, mana or level"
"action.stats.help" = "Sets a player's health, stamina or mana to a value, which the game keeps within the maximum, or their level, which the game sets in its next step."
"action.revive" = "Revive"
"action.revive.help" = "Revives a dead player where they lie, with full health, without a respawn."
"action.learn" = "Teach a recipe"
"action.learn.help" = "Unlocks a recipe for a player, named by the game's name, such as Tool_Torch01, its GUID or a mod's content id; or grants any knowledge by its number."
"action.god" = "God mode"
"action.god.help" = "Nothing damages a player in god mode. It ends when they leave or the world stops."
"action.chest" = "Chest of items at a player"
"action.chest.help" = "Places a wooden chest beside a player and fills it with items, named as for giving one. A chest outside every base is not saved."
"action.chestat" = "Chest of items at a position"
"action.chestat.help" = "Places a wooden chest at a position and fills it with items, named as for giving one. A chest outside every base is not saved."
"action.clear" = "Clear inventory"
"action.clear.help" = "Destroys every stack in every slot a player has, equipment, action bar and look slots included."
"action.copy" = "Copy inventory"
"action.copy.help" = "Gives the second player new items of every stack the first carries or wears. Items start new, without wear or level; what does not fit stays out, and the look and currency slots are not copied."
"action.give" = "Give an item"
"action.give.help" = "Gives a player new items, one when the count is left out, in as many stacks as they need. The window lists the items by the names your game shows. A typed command names the item by its debug name, such as Tool_Glider_T1, its GUID or a mod's content id; in a game a player hosts, also by the name the game shows, such as Glider."
"action.goto" = "Go to a player"
"action.goto.help" = "Takes you to a player."
"action.bring" = "Bring a player"
"action.bring.help" = "Brings a player to you."
"action.send" = "Send a player to another"
"action.send.help" = "Moves the first player to the second."
"action.place" = "Move a player to a position"
"action.place.help" = "Moves a player to a position in metres, on free ground near it."
"action.time" = "Time of day"
"action.time.help" = "Sets the time of day: write it as 18:30, or in hours, such as 6.5 for 06:30."
"action.weather" = "Weather"
"action.weather.help" = "Starts the weather you pick everywhere."
"action.restart" = "Restart warning"
"action.restart.help" = "Warns every player of a restart in this many minutes, again as it comes nearer. 0 stops the warning."
"action.audit" = "Audit log"
"action.audit.help" = "The last admin actions, newest last."
"action.status" = "Server status"
"action.status.help" = "The Enshwick and mod versions, the time since the server started and the world."
"action.save" = "Save now"
"action.save.help" = "Saves the world now, as the game's timed saves do."
"action.backup" = "Back up the world"
"action.backup.help" = "Copies the world's save with its mod settings and data to a backup folder named by the time, while the server runs."
"action.world" = "World settings"
"action.world.help" = "The world, its last save and its game settings."
"action.chat" = "Chat log"
"action.chat.help" = "The last chat lines, newest last."
