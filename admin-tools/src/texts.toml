"action.setmotd.help" = "플레이어가 접속할 때 읽는 내용을 월드 설정 대신 정합니다. - 하나만 쓰면 설정으로 돌아갑니다."
"action.mark" = "플레이어를 내 중간 지점으로 옮기기"
"action.mark.help" = "당신이 지도에 놓은 중간 지점 근처의 빈 땅으로 플레이어를 옮깁니다."
