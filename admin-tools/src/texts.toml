"mod.name" = "Admin Tools"
"mod.description" = "Gibt den Administratoren eines Servers eine Spielerliste, Kicks, Banns, eine Zulassungsliste, Chat-Stummschaltungen, Ankündigungen, Neustartwarnungen, Tageszeit und Wetter, Heilung, Teleports, Gegenstände und Truhen voller Gegenstände, Inventare, Lebenspunkte, Ausdauer und Mana, Rezepte, Gottmodus, Speichern und Sicherungen, eine Fernkonsole sowie Prüf- und Chatprotokolle."
"action.online" = "Spieler online"
"action.online.help" = "Jeder Spieler online, mit seiner Zeit online und ob er stummgeschaltet ist."
"action.motd" = "Nachricht des Tages"
"action.motd.help" = "Was Spieler beim Beitreten lesen: die im Spiel gesetzte Nachricht, sonst die aus den Einstellungen der Welt."
"action.kick" = "Kicken"
"action.kick.help" = "Entfernt einen Spieler aus dem Spiel. Er kann wieder beitreten."
"action.banned" = "Gebannt"
"action.banned.help" = "Bannt einen Spieler, online oder abwesend, oder hebt einen Bann auf. Ein Bann gilt, wenn das Konto zurückkommt, auch nach einem Neustart."
"action.allowed" = "Zulassungsliste"
"action.allowed.help" = "Solange die Zulassungsliste in den Einstellungen der Welt an ist, dürfen nur diese Konten und Administratoren beitreten."
"action.muted" = "Im Chat stumm"
"action.muted.help" = "Die Chatzeilen eines stummgeschalteten Spielers erreichen niemanden. Administratoren und der Host sind nie stumm."
"action.heal" = "Heilen"
"action.heal.help" = "Gibt einem Spieler seine vollen Lebenspunkte."
"action.stats" = "Lebenspunkte, Ausdauer, Mana oder Stufe setzen"
"action.stats.help" = "Setzt die Lebenspunkte, Ausdauer oder das Mana eines Spielers auf einen Wert, den das Spiel im Maximum hält, oder seine Stufe, die das Spiel in seinem nächsten Schritt setzt."
"action.revive" = "Wiederbeleben"
"action.revive.help" = "Belebt einen toten Spieler dort wieder, wo er liegt, mit vollen Lebenspunkten, ohne Respawn."
"action.learn" = "Rezept beibringen"
"action.learn.help" = "Schaltet ein Rezept für einen Spieler frei, benannt mit dem Namen des Spiels, etwa Tool_Torch01, seiner GUID oder der Inhalts-ID eines Mods; oder gewährt beliebiges Wissen über seine Nummer."
"action.god" = "Gottmodus"
"action.god.help" = "Im Gottmodus fügt nichts einem Spieler Schaden zu. Er endet, wenn der Spieler geht oder die Welt anhält."
"action.chest" = "Truhe mit Gegenständen bei einem Spieler"
"action.chest.help" = "Stellt eine Holztruhe neben einen Spieler und füllt sie mit Gegenständen, benannt wie beim Geben. Eine Truhe außerhalb jeder Basis wird nicht gespeichert."
"action.chestat" = "Truhe mit Gegenständen an einer Position"
"action.chestat.help" = "Stellt eine Holztruhe an eine Position und füllt sie mit Gegenständen, benannt wie beim Geben. Eine Truhe außerhalb jeder Basis wird nicht gespeichert."
"action.clear" = "Inventar leeren"
"action.clear.help" = "Zerstört jeden Stapel in jedem Platz eines Spielers, Ausrüstung, Aktionsleiste und Aussehensplätze eingeschlossen."
"action.copy" = "Inventar kopieren"
"action.copy.help" = "Gibt dem zweiten Spieler neue Gegenstände von jedem Stapel, den der erste trägt oder angelegt hat. Die Gegenstände sind neu, ohne Abnutzung oder Stufe; was nicht passt, bleibt weg, und Aussehens- und Währungsplätze werden nicht kopiert."
"action.give" = "Gegenstand geben"
"action.give.help" = "Gibt einem Spieler neue Gegenstände, einen, wenn die Anzahl fehlt, in so vielen Stapeln wie nötig. Das Fenster listet die Gegenstände mit den Namen, die dein Spiel zeigt. Ein getippter Befehl nennt den Gegenstand mit seinem Debug-Namen, etwa Tool_Glider_T1, seiner GUID oder der Inhalts-ID eines Mods; in einem Spiel, das ein Spieler hostet, auch mit dem Namen, den das Spiel zeigt, etwa Gleiter."
"action.goto" = "Zu einem Spieler gehen"
"action.goto.help" = "Bringt dich zu einem Spieler."
"action.bring" = "Spieler holen"
"action.bring.help" = "Holt einen Spieler zu dir."
"action.send" = "Spieler zu einem anderen schicken"
"action.send.help" = "Bewegt den ersten Spieler zum zweiten."
"action.place" = "Spieler an eine Position bewegen"
"action.place.help" = "Bewegt einen Spieler an eine Position in Metern, auf freien Boden in ihrer Nähe."
"action.time" = "Tageszeit"
"action.time.help" = "Setzt die Tageszeit: schreib sie als 18:30 oder in Stunden, etwa 6.5 für 06:30."
"action.weather" = "Wetter"
"action.weather.help" = "Startet überall das Wetter, das du wählst."
"action.restart" = "Neustartwarnung"
"action.restart.help" = "Warnt jeden Spieler vor einem Neustart in so vielen Minuten, erneut, wenn er näher rückt. 0 beendet die Warnung."
"action.audit" = "Prüfprotokoll"
"action.audit.help" = "Die letzten Admin-Aktionen, die neueste zuletzt."
"action.status" = "Serverstatus"
"action.status.help" = "Die Versionen von Enshwick und den Mods, die Zeit seit dem Serverstart und die Welt."
"action.save" = "Jetzt speichern"
"action.save.help" = "Speichert die Welt jetzt, wie es die zeitgesteuerten Speicherungen des Spiels tun."
"action.backup" = "Welt sichern"
"action.backup.help" = "Kopiert den Spielstand der Welt mit ihren Mod-Einstellungen und Daten in einen nach der Uhrzeit benannten Sicherungsordner, während der Server läuft."
"action.world" = "Welteinstellungen"
"action.world.help" = "Die Welt, ihr letzter Speicherstand und ihre Spieleinstellungen."
"action.chat" = "Chatprotokoll"
"action.chat.help" = "Die letzten Chatzeilen, die neueste zuletzt."
