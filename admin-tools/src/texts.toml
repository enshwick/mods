[ko]
"mod.name" = "Admin Tools"
"mod.description" = "서버 관리자에게 플레이어 목록, 추방, 차단, 허용 목록, 채팅 음소거, 공지, 재시작 경고, 시간과 날씨, 치유, 순간이동, 아이템과 아이템 상자, 인벤토리, 체력·기력·마나, 레시피, 신 모드, 저장과 백업, 원격 콘솔, 감사 기록과 채팅 기록을 제공합니다."
"action.online" = "접속 중인 플레이어"
"action.online.help" = "접속 중인 각 플레이어와 접속 시간, 음소거 여부."
"action.motd" = "오늘의 메시지"
"action.motd.help" = "플레이어가 접속할 때 읽는 내용: 게임에서 설정한 메시지, 없으면 월드 설정의 메시지."
"action.kick" = "추방"
"action.kick.help" = "플레이어를 게임에서 내보냅니다. 다시 접속할 수 있습니다."
"action.banned" = "차단"
"action.banned.help" = "접속 중이든 아니든 플레이어를 차단하거나 차단을 풉니다. 차단은 계정이 돌아와도, 재시작 후에도 유지됩니다."
"action.allowed" = "허용 목록"
"action.allowed.help" = "월드 설정에서 허용 목록이 켜져 있는 동안에는 이 계정들과 관리자만 접속할 수 있습니다."
"action.muted" = "채팅 음소거"
"action.muted.help" = "음소거된 플레이어의 채팅은 아무에게도 전달되지 않습니다. 관리자와 호스트는 음소거되지 않습니다."
"action.heal" = "치유"
"action.heal.help" = "플레이어의 체력을 가득 채웁니다."
"action.stats" = "체력, 기력, 마나 또는 레벨 설정"
"action.stats.help" = "플레이어의 체력, 기력 또는 마나를 값으로 설정합니다. 게임은 이를 최대치 안에서 유지합니다. 또는 레벨을 설정하며, 게임은 다음 단계에서 이를 적용합니다."
"action.revive" = "부활"
"action.revive.help" = "죽은 플레이어를 쓰러진 자리에서 체력을 가득 채워 부활시킵니다. 리스폰하지 않습니다."
"action.learn" = "레시피 가르치기"
"action.learn.help" = "플레이어에게 레시피를 해금합니다. Tool_Torch01 같은 게임 내 이름, GUID 또는 모드의 콘텐츠 ID로 지정합니다. 번호로 어떤 지식이든 줄 수도 있습니다."
"action.god" = "신 모드"
"action.god.help" = "신 모드인 플레이어는 어떤 피해도 받지 않습니다. 플레이어가 나가거나 월드가 멈추면 끝납니다."
"action.chest" = "플레이어 옆에 아이템 상자"
"action.chest.help" = "플레이어 옆에 나무 상자를 놓고 아이템을 채웁니다. 아이템은 아이템을 줄 때처럼 지정합니다. 어느 거점에도 속하지 않은 상자는 저장되지 않습니다."
"action.chestat" = "위치에 아이템 상자"
"action.chestat.help" = "지정한 위치에 나무 상자를 놓고 아이템을 채웁니다. 아이템은 아이템을 줄 때처럼 지정합니다. 어느 거점에도 속하지 않은 상자는 저장되지 않습니다."
"action.clear" = "인벤토리 비우기"
"action.clear.help" = "플레이어의 모든 칸에 있는 모든 묶음을 파괴합니다. 장비, 액션 바, 외형 칸도 포함됩니다."
"action.copy" = "인벤토리 복사"
"action.copy.help" = "첫 번째 플레이어가 지니거나 착용한 모든 묶음의 새 아이템을 두 번째 플레이어에게 줍니다. 아이템은 마모와 레벨 없이 새것으로 시작합니다. 들어가지 않는 것은 빠지고, 외형 칸과 화폐 칸은 복사되지 않습니다."
"action.give" = "아이템 주기"
"action.give.help" = "플레이어에게 새 아이템을 줍니다. 개수를 생략하면 하나이며, 필요한 만큼의 묶음으로 나눕니다. 창은 아이템을 당신의 게임에 표시되는 이름으로 보여 줍니다. 입력한 명령은 Tool_Glider_T1 같은 디버그 이름, GUID 또는 모드의 콘텐츠 ID로 아이템을 지정합니다. 플레이어가 호스트하는 게임에서는 글라이더처럼 게임에 표시되는 이름으로도 지정할 수 있습니다."
"action.goto" = "플레이어에게 가기"
"action.goto.help" = "당신을 플레이어에게 데려갑니다."
"action.bring" = "플레이어 데려오기"
"action.bring.help" = "플레이어를 당신에게 데려옵니다."
"action.send" = "플레이어를 다른 플레이어에게 보내기"
"action.send.help" = "첫 번째 플레이어를 두 번째 플레이어에게 옮깁니다."
"action.place" = "플레이어를 위치로 옮기기"
"action.place.help" = "플레이어를 미터 단위 위치 근처의 빈 땅으로 옮깁니다."
"action.time" = "시간"
"action.time.help" = "하루 중 시간을 설정합니다. 18:30처럼 쓰거나, 06:30이면 6.5처럼 시간 단위로 씁니다."
"action.weather" = "날씨"
