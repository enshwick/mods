[ru]
"mod.name" = "Admin Tools"
"mod.description" = "Даёт администраторам сервера список игроков, удаление, блокировки, список допуска, отключение чата, объявления, предупреждения о перезапуске, время суток и погоду, лечение, телепорты, предметы и сундуки с предметами, снаряжение, здоровье, выносливость и ману, схемы, режим бога, сохранения и резервные копии, удалённую консоль, а также журналы действий и чата."
"action.online" = "Игроки в сети"
"action.online.help" = "Каждый игрок в сети, с его временем в сети и тем, отключён ли ему чат."
"action.motd" = "Сообщение дня"
"action.motd.help" = "Что игроки читают при входе: сообщение, заданное в игре, иначе сообщение из настроек мира."
"action.kick" = "Удалить"
"action.kick.help" = "Удаляет игрока из игры. Он может войти снова."
"action.banned" = "Заблокированные"
"action.banned.help" = "Блокирует игрока, в сети или нет, или снимает блокировку. Блокировка действует, когда аккаунт возвращается, и после перезапуска тоже."
"action.allowed" = "Список допуска"
"action.allowed.help" = "Пока список допуска включён в настройках мира, входить могут только эти аккаунты и администраторы."
"action.muted" = "Без чата"
"action.muted.help" = "Строки чата игрока без чата не доходят ни до кого. Администраторам и хосту чат никогда не отключается."
"action.heal" = "Вылечить"
"action.heal.help" = "Восстанавливает игроку всё здоровье."
"action.stats" = "Задать здоровье, выносливость, ману или уровень"
"action.stats.help" = "Задаёт здоровье, выносливость или ману игрока, которые игра держит в пределах максимума, или его уровень, который игра задаёт на следующем шаге."
"action.revive" = "Воскресить"
"action.revive.help" = "Воскрешает мёртвого игрока там, где он лежит, с полным здоровьем, без возрождения."
"action.learn" = "Обучить схеме"
"action.learn.help" = "Открывает игроку схему, названную именем из игры, например Tool_Torch01, её GUID или id содержимого мода; или даёт любое знание по его номеру."
"action.god" = "Режим бога"
"action.god.help" = "В режиме бога ничто не наносит игроку урон. Режим заканчивается, когда игрок уходит или мир останавливается."
"action.chest" = "Сундук с предметами у игрока"
"action.chest.help" = "Ставит деревянный сундук рядом с игроком и наполняет его предметами, названными как для выдачи. Сундук вне любой базы не сохраняется."
"action.chestat" = "Сундук с предметами в точке"
"action.chestat.help" = "Ставит деревянный сундук в точке и наполняет его предметами, названными как для выдачи. Сундук вне любой базы не сохраняется."
"action.clear" = "Очистить снаряжение"
"action.clear.help" = "Уничтожает каждую стопку в каждой ячейке игрока, включая снаряжение, панель действий и ячейки внешнего вида."
"action.copy" = "Скопировать снаряжение"
"action.copy.help" = "Даёт второму игроку новые предметы из каждой стопки, которую первый носит или надел. Предметы новые, без износа и уровня; что не помещается, остаётся в стороне, а ячейки внешнего вида и валюты не копируются."
"action.give" = "Выдать предмет"
"action.give.help" = "Даёт игроку новые предметы, один, если количество не указано, в стольких стопках, сколько нужно. Окно показывает предметы под названиями из твоей игры. Набранная команда называет предмет его отладочным именем, например Tool_Glider_T1, его GUID или id содержимого мода; в игре, которую проводит игрок, также названием, которое показывает игра, например Планер."
"action.goto" = "Перейти к игроку"
"action.goto.help" = "Переносит тебя к игроку."
"action.bring" = "Призвать игрока"
"action.bring.help" = "Переносит игрока к тебе."
"action.send" = "Отправить игрока к другому"
"action.send.help" = "Переносит первого игрока ко второму."
"action.place" = "Перенести игрока в точку"
"action.place.help" = "Переносит игрока в точку, заданную в метрах, на свободную землю рядом с ней."
"action.time" = "Время суток"
"action.time.help" = "Задаёт время суток: напиши его как 18:30 или в часах, например 6.5 для 06:30."
"action.weather" = "Погода"
"action.weather.help" = "Включает везде выбранную тобой погоду."
"action.restart" = "Предупреждение о перезапуске"
"action.restart.help" = "Предупреждает каждого игрока о перезапуске через столько минут и снова по мере приближения. 0 отменяет предупреждение."
"action.audit" = "Журнал действий"
"action.audit.help" = "Последние действия администраторов, новые в конце."
"action.status" = "Состояние сервера"
"action.status.help" = "Версии Enshwick и модов, время с запуска сервера и мир."
"action.save" = "Сохранить сейчас"
"action.save.help" = "Сохраняет мир сейчас, как это делают плановые сохранения игры."
"action.backup" = "Резервная копия мира"
"action.backup.help" = "Копирует сохранение мира с настройками и данными модов в папку резервной копии, названную по времени, пока сервер работает."
"action.world" = "Настройки мира"
