[es]
"mod.name" = "Admin Tools"
"mod.description" = "Da a los administradores de un servidor una lista de jugadores, expulsiones, bloqueos, una lista de permitidos, silencios en el chat, anuncios, avisos de reinicio, hora y clima, curación, teletransportes, objetos y cofres de objetos, inventarios, salud, vigor y maná, recetas, modo dios, guardados y copias de seguridad, una consola remota y registros de auditoría y de chat."
"action.online" = "Jugadores conectados"
"action.online.help" = "Cada jugador conectado, con su tiempo conectado y si está silenciado."
"action.motd" = "Mensaje del día"
"action.motd.help" = "Lo que leen los jugadores al entrar: el mensaje puesto en el juego, si no, el de los ajustes del mundo."
"action.kick" = "Expulsar"
"action.kick.help" = "Saca a un jugador de la partida. Puede volver a entrar."
"action.banned" = "Bloqueados"
"action.banned.help" = "Bloquea a un jugador, conectado o ausente, o levanta un bloqueo. Un bloqueo se mantiene cuando la cuenta vuelve, también tras un reinicio."
"action.allowed" = "Lista de permitidos"
"action.allowed.help" = "Mientras la lista de permitidos esté activada en los ajustes del mundo, solo estas cuentas y los administradores pueden entrar."
"action.muted" = "Silenciados en el chat"
"action.muted.help" = "Las líneas de chat de un jugador silenciado no llegan a nadie. Los administradores y el anfitrión nunca están silenciados."
"action.heal" = "Curar"
"action.heal.help" = "Da a un jugador toda su salud."
"action.stats" = "Fijar salud, vigor, maná o nivel"
"action.stats.help" = "Fija la salud, el vigor o el maná de un jugador en un valor, que el juego mantiene dentro del máximo, o su nivel, que el juego fija en su siguiente paso."
"action.revive" = "Revivir"
"action.revive.help" = "Revive a un jugador muerto donde yace, con toda su salud, sin reaparecer."
"action.learn" = "Enseñar una receta"
"action.learn.help" = "Desbloquea una receta para un jugador, indicada por el nombre del juego, como Tool_Torch01, su GUID o el id de contenido de un mod; o concede cualquier conocimiento por su número."
"action.god" = "Modo dios"
"action.god.help" = "Nada daña a un jugador en modo dios. Termina cuando el jugador se va o el mundo se detiene."
"action.chest" = "Cofre de objetos junto a un jugador"
"action.chest.help" = "Coloca un cofre de madera junto a un jugador y lo llena de objetos, indicados como para dar uno. Un cofre fuera de toda base no se guarda."
"action.chestat" = "Cofre de objetos en una posición"
"action.chestat.help" = "Coloca un cofre de madera en una posición y lo llena de objetos, indicados como para dar uno. Un cofre fuera de toda base no se guarda."
"action.clear" = "Vaciar el inventario"
"action.clear.help" = "Destruye cada pila de cada casilla de un jugador, incluidos el equipo, la barra de acciones y las casillas de aspecto."
"action.copy" = "Copiar el inventario"
"action.copy.help" = "Da al segundo jugador objetos nuevos de cada pila que el primero lleva o viste. Los objetos empiezan nuevos, sin desgaste ni nivel; lo que no cabe se queda fuera, y las casillas de aspecto y de moneda no se copian."
"action.give" = "Dar un objeto"
"action.give.help" = "Da a un jugador objetos nuevos, uno si se omite la cantidad, en tantas pilas como necesite. La ventana muestra los objetos con los nombres que muestra tu juego. Un comando escrito indica el objeto por su nombre de depuración, como Tool_Glider_T1, su GUID o el id de contenido de un mod; en una partida que aloja un jugador, también por el nombre que muestra el juego, como Planeador."
"action.goto" = "Ir hacia un jugador"
"action.goto.help" = "Te lleva hasta un jugador."
"action.bring" = "Traer a un jugador"
"action.bring.help" = "Trae a un jugador hasta ti."
"action.send" = "Enviar un jugador a otro"
"action.send.help" = "Mueve al primer jugador hasta el segundo."
"action.place" = "Mover un jugador a una posición"
"action.place.help" = "Mueve a un jugador a una posición en metros, sobre suelo libre cercano."
"action.time" = "Hora del día"
"action.time.help" = "Fija la hora del día: escríbela como 18:30, o en horas, como 6.5 para las 06:30."
"action.weather" = "Clima"
"action.weather.help" = "Inicia en todas partes el clima que elijas."
"action.restart" = "Aviso de reinicio"
"action.restart.help" = "Avisa a cada jugador de un reinicio dentro de estos minutos, y otra vez a medida que se acerca. 0 detiene el aviso."
"action.audit" = "Registro de auditoría"
"action.audit.help" = "Las últimas acciones de administración, la más reciente al final."
"action.status" = "Estado del servidor"
"action.status.help" = "Las versiones de Enshwick y de los mods, el tiempo desde que arrancó el servidor y el mundo."
"action.save" = "Guardar ahora"
"action.save.help" = "Guarda el mundo ahora, como hacen los guardados periódicos del juego."
"action.backup" = "Copia de seguridad del mundo"
"action.backup.help" = "Copia el guardado del mundo, con sus ajustes y datos de mods, en una carpeta de copia nombrada por la hora, mientras el servidor funciona."
"action.world" = "Ajustes del mundo"
"action.world.help" = "El mundo, su último guardado y sus ajustes de juego."
"action.chat" = "Registro del chat"
"action.chat.help" = "Las últimas líneas del chat, la más reciente al final."
