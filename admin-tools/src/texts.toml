"mod.description" = "サーバーの管理者に、プレイヤー一覧、追放、BAN、許可リスト、チャットのミュート、お知らせ、再起動の警告、時刻と天候、回復、テレポート、アイテムとアイテム入りの箱、インベントリ、HP・スタミナ・MP、レシピ、ゴッドモード、セーブとバックアップ、リモートコンソール、監査ログとチャットログを提供します。"
"action.online" = "オンラインのプレイヤー"
"action.online.help" = "オンラインの各プレイヤーと、そのオンライン時間、ミュート中かどうか。"
"action.motd" = "今日のメッセージ"
"action.motd.help" = "参加したプレイヤーが読む内容。ゲーム内で設定したメッセージ、なければワールド設定のメッセージ。"
"action.kick" = "追放"
"action.kick.help" = "プレイヤーをゲームから外します。再び参加できます。"
"action.banned" = "BAN"
"action.banned.help" = "オンラインか不在かを問わずプレイヤーをBANするか、BANを解除します。BANはアカウントが戻ってきたときも、再起動後も有効です。"
"action.allowed" = "許可リスト"
"action.allowed.help" = "ワールド設定で許可リストがオンの間、参加できるのはこれらのアカウントと管理者だけです。"
"action.muted" = "チャットのミュート"
"action.muted.help" = "ミュート中のプレイヤーのチャットは誰にも届きません。管理者とホストはミュートされません。"
"action.heal" = "回復"
"action.heal.help" = "プレイヤーのHPを満タンにします。"
"action.stats" = "HP・スタミナ・MP・レベルの設定"
"action.stats.help" = "プレイヤーのHP、スタミナ、MPを値に設定します（ゲームが最大値の範囲に収めます）。またはレベルを設定します（ゲームが次のステップで反映します）。"
"action.revive" = "蘇生"
"action.revive.help" = "倒れたプレイヤーをその場でHP満タンで蘇生します。リスポーンはしません。"
"action.learn" = "レシピを教える"
"action.learn.help" = "プレイヤーにレシピを解放します。Tool_Torch01 のようなゲーム内の名前、GUID、またはModのコンテンツIDで指定します。番号で任意の知識を与えることもできます。"
"action.god" = "ゴッドモード"
"action.god.help" = "ゴッドモードのプレイヤーは何からもダメージを受けません。プレイヤーが抜けるか、ワールドが止まると終わります。"
"action.chest" = "プレイヤーの横にアイテム入りの箱"
"action.chest.help" = "プレイヤーの横に木製の箱を置き、アイテムを入れます。アイテムはアイテムを渡すときと同じように指定します。どの拠点の外にある箱もセーブされません。"
"action.chestat" = "指定位置にアイテム入りの箱"
"action.chestat.help" = "指定した位置に木製の箱を置き、アイテムを入れます。アイテムはアイテムを渡すときと同じように指定します。どの拠点の外にある箱もセーブされません。"
"action.clear" = "インベントリを空にする"
"action.clear.help" = "プレイヤーのすべてのスロットのスタックをすべて破壊します。装備、アクションバー、外見スロットも含みます。"
"action.copy" = "インベントリをコピー"
"action.copy.help" = "1人目のプレイヤーが持っている、または装備しているスタックごとに、新しいアイテムを2人目に渡します。アイテムは新品で、摩耗もレベルもありません。入りきらない分は外され、外見スロットと通貨スロットはコピーされません。"
"action.give" = "アイテムを渡す"
"action.give.help" = "プレイヤーに新しいアイテムを渡します。個数を省くと1個で、必要なだけのスタックに分けます。ウィンドウには、あなたのゲームで表示される名前でアイテムが並びます。入力するコマンドでは、Tool_Glider_T1 のようなデバッグ名、GUID、またはModのコンテンツIDでアイテムを指定します。プレイヤーがホストするゲームでは、グライダー のようにゲームで表示される名前でも指定できます。"
"action.goto" = "プレイヤーの所へ行く"
"action.goto.help" = "あなたをプレイヤーの所へ移動します。"
"action.bring" = "プレイヤーを呼び寄せる"
"action.bring.help" = "プレイヤーをあなたの所へ移動します。"
"action.send" = "プレイヤーを別のプレイヤーへ送る"
"action.send.help" = "1人目のプレイヤーを2人目の所へ移動します。"
"action.place" = "プレイヤーを位置へ移動"
"action.place.help" = "プレイヤーをメートル単位の位置へ、その近くの空いた地面に移動します。"
"action.time" = "時刻"
"action.time.help" = "時刻を設定します。18:30 のように、または 6.5（06:30）のように時間数で書きます。"
"action.weather" = "天候"
"action.weather.help" = "選んだ天候をすべての場所で始めます。"
"action.restart" = "再起動の警告"
"action.restart.help" = "指定した分数後の再起動をすべてのプレイヤーに警告し、近づくたびに再び警告します。0 で警告を止めます。"
"action.audit" = "監査ログ"
"action.audit.help" = "最近の管理操作。新しいものが最後です。"
"action.status" = "サーバーの状態"
"action.status.help" = "Enshwick とModのバージョン、サーバー起動からの時間、ワールド。"
"action.save" = "今すぐセーブ"
"action.save.help" = "ゲームの定期セーブと同じように、ワールドを今すぐセーブします。"
"action.backup" = "ワールドをバックアップ"
"action.backup.help" = "サーバーの稼働中に、ワールドのセーブをModの設定とデータごと、時刻の名前のバックアップフォルダーへコピーします。"
"action.world" = "ワールド設定"
