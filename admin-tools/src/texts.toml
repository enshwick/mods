[fr]
"mod.name" = "Admin Tools"
"mod.description" = "Donne aux administrateurs d'un serveur une liste des joueurs, des expulsions, des bannissements, une liste d'autorisation, la mise en sourdine du chat, des annonces, des avertissements de redémarrage, l'heure et la météo, les soins, les téléportations, des objets et des coffres d'objets, les inventaires, la santé, l'endurance et le mana, les procédés, le mode dieu, les sauvegardes et les copies de sauvegarde, une console à distance, ainsi que des journaux d'audit et de chat."
"action.online" = "Joueurs en ligne"
"action.online.help" = "Chaque joueur en ligne, avec son temps en ligne et s'il est en sourdine."
"action.motd" = "Message du jour"
"action.motd.help" = "Ce que les joueurs lisent en arrivant : le message défini en jeu, sinon celui des paramètres du monde."
"action.kick" = "Expulser"
"action.kick.help" = "Retire un joueur de la partie. Il peut revenir."
"action.banned" = "Bannis"
"action.banned.help" = "Bannit un joueur, en ligne ou absent, ou lève un bannissement. Un bannissement tient quand le compte revient, même après un redémarrage."
"action.allowed" = "Liste d'autorisation"
"action.allowed.help" = "Tant que la liste d'autorisation est activée dans les paramètres du monde, seuls ces comptes et les administrateurs peuvent rejoindre."
"action.muted" = "En sourdine dans le chat"
"action.muted.help" = "Les lignes de chat d'un joueur en sourdine n'atteignent personne. Les administrateurs et l'hôte ne sont jamais en sourdine."
"action.heal" = "Soigner"
"action.heal.help" = "Rend à un joueur toute sa santé."
"action.stats" = "Régler la santé, l'endurance, le mana ou le niveau"
"action.stats.help" = "Règle la santé, l'endurance ou le mana d'un joueur sur une valeur, que le jeu garde dans le maximum, ou son niveau, que le jeu applique à son étape suivante."
"action.revive" = "Ranimer"
"action.revive.help" = "Ranime un joueur mort là où il gît, avec toute sa santé, sans réapparition."
"action.learn" = "Apprendre un procédé"
"action.learn.help" = "Débloque un procédé pour un joueur, désigné par le nom du jeu, comme Tool_Torch01, son GUID ou l'identifiant de contenu d'un mod ; ou accorde n'importe quelle connaissance par son numéro."
"action.god" = "Mode dieu"
"action.god.help" = "Rien n'inflige de dégâts à un joueur en mode dieu. Il prend fin quand le joueur part ou que le monde s'arrête."
"action.chest" = "Coffre d'objets près d'un joueur"
"action.chest.help" = "Pose un coffre en bois à côté d'un joueur et le remplit d'objets, désignés comme pour en donner un. Un coffre hors de toute base n'est pas sauvegardé."
"action.chestat" = "Coffre d'objets à une position"
"action.chestat.help" = "Pose un coffre en bois à une position et le remplit d'objets, désignés comme pour en donner un. Un coffre hors de toute base n'est pas sauvegardé."
"action.clear" = "Vider l'inventaire"
"action.clear.help" = "Détruit chaque pile de chaque emplacement d'un joueur, équipement, barre d'action et emplacements d'apparence compris."
"action.copy" = "Copier l'inventaire"
"action.copy.help" = "Donne au second joueur des objets neufs de chaque pile que le premier porte ou équipe. Les objets sont neufs, sans usure ni niveau ; ce qui ne rentre pas est laissé de côté, et les emplacements d'apparence et de monnaie ne sont pas copiés."
"action.give" = "Donner un objet"
"action.give.help" = "Donne à un joueur des objets neufs, un seul si le nombre est omis, en autant de piles qu'il faut. La fenêtre liste les objets sous les noms que ton jeu affiche. Une commande tapée désigne l'objet par son nom de débogage, comme Tool_Glider_T1, son GUID ou l'identifiant de contenu d'un mod ; dans une partie qu'un joueur héberge, aussi par le nom que le jeu affiche, comme Planeur."
"action.goto" = "Aller vers un joueur"
"action.goto.help" = "T'emmène vers un joueur."
"action.bring" = "Faire venir un joueur"
"action.bring.help" = "Amène un joueur jusqu'à toi."
"action.send" = "Envoyer un joueur vers un autre"
"action.send.help" = "Déplace le premier joueur vers le second."
"action.place" = "Déplacer un joueur à une position"
"action.place.help" = "Déplace un joueur à une position en mètres, sur un sol libre à proximité."
"action.time" = "Heure du jour"
"action.time.help" = "Règle l'heure du jour : écris-la sous la forme 18:30, ou en heures, comme 6.5 pour 06:30."
"action.weather" = "Météo"
"action.weather.help" = "Lance partout la météo que tu choisis."
"action.restart" = "Avertissement de redémarrage"
"action.restart.help" = "Avertit chaque joueur d'un redémarrage dans ce nombre de minutes, puis à nouveau à mesure qu'il approche. 0 arrête l'avertissement."
"action.audit" = "Journal d'audit"
"action.audit.help" = "Les dernières actions d'administration, la plus récente en dernier."
"action.status" = "État du serveur"
"action.status.help" = "Les versions d'Enshwick et des mods, le temps depuis le démarrage du serveur et le monde."
"action.save" = "Sauvegarder maintenant"
"action.save.help" = "Sauvegarde le monde maintenant, comme le font les sauvegardes régulières du jeu."
"action.backup" = "Copier le monde"
"action.backup.help" = "Copie la sauvegarde du monde, avec ses paramètres et données de mods, dans un dossier de copie nommé d'après l'heure, pendant que le serveur tourne."
"action.world" = "Paramètres du monde"
"action.world.help" = "Le monde, sa dernière sauvegarde et ses paramètres de jeu."
"action.chat" = "Journal du chat"
"action.chat.help" = "Les dernières lignes du chat, la plus récente en dernier."
