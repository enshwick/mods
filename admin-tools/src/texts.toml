[it]
"mod.name" = "Admin Tools"
"mod.description" = "Dà agli amministratori di un server un elenco dei giocatori, espulsioni, ban, una lista di ammessi, silenziamenti in chat, annunci, avvisi di riavvio, ora e meteo, cure, teletrasporti, oggetti e casse di oggetti, inventari, salute, vigore e mana, ricette, modalità dio, salvataggi e copie di backup, una console remota e registri di controllo e della chat."
"action.online" = "Giocatori online"
"action.online.help" = "Ogni giocatore online, con il suo tempo online e se è silenziato."
"action.motd" = "Messaggio del giorno"
"action.motd.help" = "Ciò che i giocatori leggono quando entrano: il messaggio impostato in gioco, altrimenti quello delle impostazioni del mondo."
"action.kick" = "Espelli"
"action.kick.help" = "Rimuove un giocatore dalla partita. Può rientrare."
"action.banned" = "Bannati"
"action.banned.help" = "Banna un giocatore, online o assente, o revoca un ban. Un ban resta quando l'account torna, anche dopo un riavvio."
"action.allowed" = "Lista degli ammessi"
"action.allowed.help" = "Finché la lista degli ammessi è attiva nelle impostazioni del mondo, possono entrare solo questi account e gli amministratori."
"action.muted" = "Silenziati in chat"
"action.muted.help" = "Le righe di chat di un giocatore silenziato non raggiungono nessuno. Gli amministratori e l'host non sono mai silenziati."
"action.heal" = "Cura"
"action.heal.help" = "Dà a un giocatore tutta la sua salute."
"action.stats" = "Imposta salute, vigore, mana o livello"
"action.stats.help" = "Imposta la salute, il vigore o il mana di un giocatore a un valore, che il gioco tiene entro il massimo, oppure il suo livello, che il gioco imposta al passo successivo."
"action.revive" = "Rianima"
"action.revive.help" = "Rianima un giocatore morto dove giace, con tutta la salute, senza rinascita."
"action.learn" = "Insegna una ricetta"
"action.learn.help" = "Sblocca una ricetta per un giocatore, indicata con il nome del gioco, come Tool_Torch01, il suo GUID o l'ID contenuto di una mod; oppure concede qualsiasi conoscenza tramite il suo numero."
"action.god" = "Modalità dio"
"action.god.help" = "In modalità dio nulla danneggia un giocatore. Finisce quando il giocatore esce o il mondo si ferma."
"action.chest" = "Cassa di oggetti presso un giocatore"
"action.chest.help" = "Mette una cassa di legno accanto a un giocatore e la riempie di oggetti, indicati come per darne uno. Una cassa fuori da ogni base non viene salvata."
"action.chestat" = "Cassa di oggetti in una posizione"
"action.chestat.help" = "Mette una cassa di legno in una posizione e la riempie di oggetti, indicati come per darne uno. Una cassa fuori da ogni base non viene salvata."
"action.clear" = "Svuota l'inventario"
"action.clear.help" = "Distrugge ogni pila in ogni slot di un giocatore, compresi equipaggiamento, barra delle azioni e slot dell'aspetto."
"action.copy" = "Copia l'inventario"
"action.copy.help" = "Dà al secondo giocatore oggetti nuovi di ogni pila che il primo porta o indossa. Gli oggetti sono nuovi, senza usura né livello; ciò che non entra resta fuori, e gli slot dell'aspetto e della valuta non vengono copiati."
"action.give" = "Dai un oggetto"
