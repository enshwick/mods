[pt-br]
"mod.name" = "Admin Tools"
"mod.description" = "Dá aos administradores de um servidor uma lista de jogadores, expulsões, banimentos, uma lista de permitidos, silenciamento no chat, anúncios, avisos de reinício, hora e clima, cura, teletransportes, itens e baús de itens, inventários, saúde, vigor e mana, receitas, modo deus, salvamentos e backups, um console remoto e registros de auditoria e de chat."
"action.online" = "Jogadores online"
"action.online.help" = "Cada jogador online, com seu tempo online e se está silenciado."
"action.motd" = "Mensagem do dia"
"action.motd.help" = "O que os jogadores leem ao entrar: a mensagem definida no jogo, senão a das configurações do mundo."
"action.kick" = "Expulsar"
"action.kick.help" = "Remove um jogador da partida. Ele pode entrar de novo."
"action.banned" = "Banidos"
"action.banned.help" = "Bane um jogador, online ou ausente, ou retira um banimento. Um banimento vale quando a conta volta, também depois de um reinício."
"action.allowed" = "Lista de permitidos"
"action.allowed.help" = "Enquanto a lista de permitidos estiver ligada nas configurações do mundo, só essas contas e os administradores podem entrar."
"action.muted" = "Silenciados no chat"
"action.muted.help" = "As linhas de chat de um jogador silenciado não chegam a ninguém. Administradores e o anfitrião nunca são silenciados."
"action.heal" = "Curar"
"action.heal.help" = "Dá a um jogador toda a sua saúde."
"action.stats" = "Definir saúde, vigor, mana ou nível"
"action.stats.help" = "Define a saúde, o vigor ou a mana de um jogador em um valor, que o jogo mantém dentro do máximo, ou seu nível, que o jogo define no próximo passo."
"action.revive" = "Reviver"
"action.revive.help" = "Revive um jogador morto onde ele está caído, com toda a saúde, sem renascer."
"action.learn" = "Ensinar uma receita"
"action.learn.help" = "Desbloqueia uma receita para um jogador, indicada pelo nome do jogo, como Tool_Torch01, seu GUID ou o id de conteúdo de um mod; ou concede qualquer conhecimento pelo seu número."
"action.god" = "Modo deus"
"action.god.help" = "Nada causa dano a um jogador em modo deus. Ele termina quando o jogador sai ou o mundo para."
"action.chest" = "Baú de itens junto a um jogador"
"action.chest.help" = "Coloca um baú de madeira ao lado de um jogador e o enche de itens, indicados como para dar um. Um baú fora de qualquer base não é salvo."
"action.chestat" = "Baú de itens em uma posição"
"action.chestat.help" = "Coloca um baú de madeira em uma posição e o enche de itens, indicados como para dar um. Um baú fora de qualquer base não é salvo."
"action.clear" = "Esvaziar inventário"
"action.clear.help" = "Destrói cada pilha em cada espaço de um jogador, incluindo equipamento, barra de ações e espaços de aparência."
"action.copy" = "Copiar inventário"
"action.copy.help" = "Dá ao segundo jogador itens novos de cada pilha que o primeiro carrega ou veste. Os itens começam novos, sem desgaste nem nível; o que não couber fica de fora, e os espaços de aparência e de moeda não são copiados."
"action.give" = "Dar um item"
"action.give.help" = "Dá a um jogador itens novos, um quando a quantidade é omitida, em quantas pilhas forem necessárias. A janela lista os itens pelos nomes que o seu jogo mostra. Um comando digitado indica o item pelo seu nome de depuração, como Tool_Glider_T1, seu GUID ou o id de conteúdo de um mod; em uma partida hospedada por um jogador, também pelo nome que o jogo mostra, como Planador."
"action.goto" = "Ir até um jogador"
"action.goto.help" = "Leva você até um jogador."
"action.bring" = "Trazer um jogador"
"action.bring.help" = "Traz um jogador até você."
"action.send" = "Enviar um jogador a outro"
"action.send.help" = "Move o primeiro jogador até o segundo."
"action.place" = "Mover um jogador para uma posição"
"action.place.help" = "Move um jogador para uma posição em metros, em chão livre perto dela."
"action.time" = "Hora do dia"
"action.time.help" = "Define a hora do dia: escreva como 18:30, ou em horas, como 6.5 para 06:30."
"action.weather" = "Clima"
"action.weather.help" = "Inicia em todo lugar o clima que você escolher."
"action.restart" = "Aviso de reinício"
"action.restart.help" = "Avisa cada jogador de um reinício daqui a tantos minutos, e de novo conforme ele se aproxima. 0 para o aviso."
"action.audit" = "Registro de auditoria"
"action.audit.help" = "As últimas ações de administração, a mais recente por último."
"action.status" = "Estado do servidor"
"action.status.help" = "As versões do Enshwick e dos mods, o tempo desde que o servidor iniciou e o mundo."
"action.save" = "Salvar agora"
"action.save.help" = "Salva o mundo agora, como fazem os salvamentos periódicos do jogo."
"action.backup" = "Fazer backup do mundo"
"action.backup.help" = "Copia o salvamento do mundo, com as configurações e os dados dos mods, para uma pasta de backup nomeada pela hora, enquanto o servidor funciona."
"action.world" = "Configurações do mundo"
"action.world.help" = "O mundo, seu último salvamento e suas configurações de jogo."
"action.chat" = "Registro do chat"
"action.chat.help" = "As últimas linhas do chat, a mais recente por último."
