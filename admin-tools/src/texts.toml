[tr]
"mod.name" = "Admin Tools"
"mod.description" = "Bir sunucunun yöneticilerine oyuncu listesi, atma, engelleme, izin listesi, sohbette susturma, duyurular, yeniden başlatma uyarıları, günün saati ve hava, iyileştirme, ışınlanma, eşyalar ve eşya sandıkları, envanterler, can, enerji ve mana, tarifler, tanrı modu, kayıtlar ve yedekler, uzak konsol, denetim ve sohbet günlükleri verir."
"action.online" = "Çevrimiçi oyuncular"
"action.online.help" = "Çevrimiçi her oyuncu, çevrimiçi süresi ve susturulup susturulmadığıyla."
"action.motd" = "Günün mesajı"
"action.motd.help" = "Oyuncuların katılınca okuduğu metin: oyunda ayarlanan mesaj, yoksa dünya ayarlarındaki mesaj."
"action.kick" = "At"
"action.kick.help" = "Bir oyuncuyu oyundan çıkarır. Oyuncu yeniden katılabilir."
"action.banned" = "Engellenenler"
"action.banned.help" = "Çevrimiçi ya da uzakta olan bir oyuncuyu engeller veya bir engeli kaldırır. Engel, hesap geri geldiğinde ve yeniden başlatmadan sonra da geçerlidir."
"action.allowed" = "İzin listesi"
"action.allowed.help" = "Dünya ayarlarında izin listesi açıkken yalnızca bu hesaplar ve yöneticiler katılabilir."
"action.muted" = "Sohbette susturulanlar"
"action.muted.help" = "Susturulan bir oyuncunun sohbet satırları kimseye ulaşmaz. Yöneticiler ve ev sahibi hiçbir zaman susturulmaz."
"action.heal" = "İyileştir"
"action.heal.help" = "Bir oyuncunun canını doldurur."
"action.stats" = "Can, enerji, mana veya seviye ayarla"
"action.stats.help" = "Bir oyuncunun canını, enerjisini veya manasını bir değere ayarlar; oyun bunu en yüksek değerin içinde tutar. Ya da seviyesini ayarlar; oyun bunu bir sonraki adımında uygular."
"action.revive" = "Dirilt"
"action.revive.help" = "Ölü bir oyuncuyu yattığı yerde, canı dolu olarak, yeniden doğmadan diriltir."
"action.learn" = "Tarif öğret"
"action.learn.help" = "Bir oyuncu için bir tarifin kilidini açar; tarif Tool_Torch01 gibi oyundaki adıyla, GUID ile ya da bir modun içerik kimliğiyle belirtilir. Ya da numarasıyla herhangi bir bilgiyi verir."
"action.god" = "Tanrı modu"
"action.god.help" = "Tanrı modundaki oyuncuya hiçbir şey hasar vermez. Oyuncu ayrılınca ya da dünya durunca biter."
"action.chest" = "Oyuncunun yanına eşya sandığı"
"action.chest.help" = "Bir oyuncunun yanına ahşap sandık koyar ve içini eşyalarla doldurur; eşyalar, eşya verirken olduğu gibi belirtilir. Hiçbir üssün içinde olmayan sandık kaydedilmez."
"action.chestat" = "Bir konuma eşya sandığı"
"action.chestat.help" = "Bir konuma ahşap sandık koyar ve içini eşyalarla doldurur; eşyalar, eşya verirken olduğu gibi belirtilir. Hiçbir üssün içinde olmayan sandık kaydedilmez."
"action.clear" = "Envanteri boşalt"
"action.clear.help" = "Bir oyuncunun her yuvasındaki her yığını yok eder; teçhizat, eylem çubuğu ve görünüm yuvaları da buna dahildir."
"action.copy" = "Envanteri kopyala"
"action.copy.help" = "İlk oyuncunun taşıdığı veya giydiği her yığından ikinci oyuncuya yeni eşyalar verir. Eşyalar yeni başlar, aşınma ve seviye olmadan; sığmayan dışarıda kalır, görünüm ve para yuvaları kopyalanmaz."
"action.give" = "Eşya ver"
"action.give.help" = "Bir oyuncuya yeni eşyalar verir; adet yazılmazsa bir tane, gerektiği kadar yığın halinde. Pencere eşyaları oyununda görünen adlarla listeler. Yazılan bir komut eşyayı Tool_Glider_T1 gibi hata ayıklama adıyla, GUID ile ya da bir modun içerik kimliğiyle belirtir; bir oyuncunun ev sahipliği yaptığı oyunda, Planör gibi oyunun gösterdiği adla da belirtilebilir."
"action.goto" = "Bir oyuncuya git"
"action.goto.help" = "Seni bir oyuncunun yanına götürür."
"action.bring" = "Bir oyuncuyu getir"
"action.bring.help" = "Bir oyuncuyu senin yanına getirir."
"action.send" = "Bir oyuncuyu diğerine gönder"
"action.send.help" = "İlk oyuncuyu ikincinin yanına taşır."
"action.place" = "Bir oyuncuyu bir konuma taşı"
"action.place.help" = "Bir oyuncuyu metre cinsinden bir konuma, yakınındaki boş zemine taşır."
"action.time" = "Günün saati"
"action.time.help" = "Günün saatini ayarlar: 18:30 gibi ya da saat olarak, 06:30 için 6.5 gibi yaz."
"action.weather" = "Hava"
"action.weather.help" = "Seçtiğin havayı her yerde başlatır."
"action.restart" = "Yeniden başlatma uyarısı"
"action.restart.help" = "Her oyuncuyu bu kadar dakika sonraki bir yeniden başlatma için uyarır, yaklaştıkça yine uyarır. 0 uyarıyı durdurur."
"action.audit" = "Denetim günlüğü"
"action.audit.help" = "Son yönetici eylemleri, en yenisi en sonda."
"action.status" = "Sunucu durumu"
"action.status.help" = "Enshwick ve mod sürümleri, sunucunun başlamasından beri geçen süre ve dünya."
"action.save" = "Şimdi kaydet"
"action.save.help" = "Oyunun zamanlı kayıtları gibi dünyayı şimdi kaydeder."
"action.backup" = "Dünyayı yedekle"
"action.backup.help" = "Sunucu çalışırken dünyanın kaydını mod ayarları ve verileriyle birlikte saate göre adlandırılan bir yedek klasörüne kopyalar."
"action.world" = "Dünya ayarları"
"action.world.help" = "Dünya, son kaydı ve oyun ayarları."
"action.chat" = "Sohbet günlüğü"
"action.chat.help" = "Son sohbet satırları, en yenisi en sonda."
