[package]
name = "enshwick-area-loot"
version = "0.1.0"
description = "Empty one enemy corpse and also get the loot of the enemies nearby"
keywords = ["enshrouded", "mod", "loot"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/area-loot"
publish = false

[package.metadata.enshwick]
id = "enshwick.area-loot"
side = "server"
name = "Area Loot"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }
rustc-hash.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
