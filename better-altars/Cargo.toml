[package]
name = "enshwick-better-altars"
version = "0.1.0"
description = "More Flame Altars per Flame level, and altar zones that touch grow together and can be built across"
keywords = ["enshrouded", "mod", "altar", "building"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/better-altars"
publish = false

[package.metadata.enshwick]
id = "enshwick.better-altars"
side = "both"
name = "Better Altars"
join = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap = { version = "1.9.3", default-features = false }
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
enshwick = { workspace = true, features = ["unstable"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
