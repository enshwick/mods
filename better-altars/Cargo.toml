[package]
name = "enshwick-better-altars"
version = "0.1.1"
description = "More Flame Altars per Flame Level, and altar zones that touch grow together and can be built across"
keywords = ["enshrouded", "mod", "altar", "building"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/better-altars"
publish = false

[package.metadata.enshwick]
id = "enshwick.better-altars"
side = "both"
name = "Better Altars"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap.workspace = true
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
enshwick = { workspace = true, features = ["unstable"] }
thiserror.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
proptest.workspace = true
toml = { workspace = true, features = ["parse", "display", "serde"] }

[lints]
workspace = true
