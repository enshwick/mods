[en]
"mod.name" = "Better Altars"
"mod.description" = "More Flame Altars per Flame level, and altar zones that touch grow together and can be built across."
"config" = "Better Altars"
"config.count" = "Altar count"
"config.count.doc" = "How many Flame Altars each Flame level allows."
"config.count.altars_per_flame_level" = "Altars per Flame level"
"config.count.altars_per_flame_level.element" = "Altars at Flame level {n}"
"config.count.altars_per_flame_level.doc" = "Altars this Flame level allows, from 1 to 255; level 0 comes before the Flame level 1 a new world starts at, and levels past the list use its last entry. Vanilla: 1, 2, 4, 6, 8, 10, 11, 12, 13, 14, 15, 16. Players on a server use the server's table."
"config.count.bases" = "Bases"
"config.count.bases.doc" = "Bases a world holds, from 16 to 179. Altars whose zones touch share a base; an altar that would start one base more is refused. A change applies when the game starts again."
"config.zones" = "Altar zones"
"config.zones.doc" = "How the zones of Flame Altars that touch grow and join."
"config.zones.clusters" = "Touching zones grow together"
"config.zones.clusters.doc" = "Altars whose zones touch grow together and share their area. Each world's own value applies when it loads."
"config.zones.building_across_seams" = "Build across seams"
"config.zones.building_across_seams.doc" = "Pieces may be placed across the seam between two zones of one group. Players on a server use the server's value."
"hold.past" = "The world has {zones} altar zones in {bases} bases, past the game's own {vanilla_zones} zones in {vanilla_bases} bases. Without Better Altars the altars past them lose their base features."
"off.grouping" = "This world is held for its altar zones, and this game version groups them in a way Better Altars does not know."
"off.thread" = "Better Altars could not start watching the altars: {error}."

[de]
"mod.name" = "Bessere Altäre"
"mod.description" = "Mehr Flammenaltäre pro Flammenstufe; Altarzonen, die sich berühren, wachsen zusammen, und man kann über ihre Grenze bauen."
"config" = "Bessere Altäre"
"config.count" = "Anzahl der Altäre"
"config.count.doc" = "Wie viele Flammenaltäre jede Flammenstufe erlaubt."
"config.count.altars_per_flame_level" = "Altäre pro Flammenstufe"
"config.count.altars_per_flame_level.element" = "Altäre auf Flammenstufe {n}"
"config.count.altars_per_flame_level.doc" = "Altäre, die diese Flammenstufe erlaubt, von 1 bis 255. Stufe 0 liegt vor Flammenstufe 1, mit der eine neue Welt beginnt; Stufen nach dem Ende der Liste nehmen ihren letzten Eintrag. Ohne Mods: 1, 2, 4, 6, 8, 10, 11, 12, 13, 14, 15, 16. Spieler auf einem Server nutzen die Tabelle des Servers."
"config.count.bases" = "Basen"
"config.count.bases.doc" = "Basen, die eine Welt hält, von 16 bis 179. Altäre, deren Zonen sich berühren, teilen sich eine Basis; ein Altar, der eine Basis mehr beginnen würde, wird abgelehnt. Eine Änderung gilt nach dem nächsten Spielstart."
"config.zones" = "Altarzonen"
"config.zones.doc" = "Wie die Zonen sich berührender Flammenaltäre wachsen und sich verbinden."
"config.zones.clusters" = "Berührende Zonen wachsen zusammen"
"config.zones.clusters.doc" = "Altäre, deren Zonen sich berühren, wachsen zusammen und teilen sich ihre Fläche. Jede Welt nutzt beim Laden ihren eigenen Wert."
"config.zones.building_across_seams" = "Über Nahtstellen bauen"
"config.zones.building_across_seams.doc" = "Bauteile dürfen über die Nahtstelle zwischen zwei Zonen einer Gruppe gesetzt werden. Spieler auf einem Server nutzen den Wert des Servers."
"hold.past" = "Die Welt hat {zones} Altarzonen in {bases} Basen, mehr als die {vanilla_zones} Zonen in {vanilla_bases} Basen des Spiels selbst. Ohne Better Altars verlieren die Altäre darüber ihre Basisfunktionen."
"off.grouping" = "Diese Welt wird wegen ihrer Altarzonen angehalten, und diese Spielversion gruppiert sie auf eine Weise, die Better Altars nicht kennt."
"off.thread" = "Better Altars konnte die Beobachtung der Altäre nicht starten: {error}."

[fr]
"mod.name" = "Meilleurs autels"
"mod.description" = "Plus d'Autels de la Flamme par niveau de Flamme ; les zones d'autels qui se touchent grandissent ensemble et l'on peut bâtir à cheval sur leur limite."
