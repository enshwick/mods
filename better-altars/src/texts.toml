"config.count.bases" = "Basi"
"config.count.bases.doc" = "Basi che un mondo contiene, da 16 a 179. Gli altari le cui zone si toccano condividono una base; un altare che inizierebbe una base in più viene rifiutato. Una modifica vale al prossimo avvio del gioco."
