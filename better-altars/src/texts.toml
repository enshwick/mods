"off.grouping" = "Этот мир удерживается из-за зон алтарей, а эта версия игры группирует их так, как Better Altars не знает."
"off.thread" = "Better Altars не смог начать следить за алтарями: {error}."

[pl]
"mod.name" = "Lepsze ołtarze"
