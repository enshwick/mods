"config.count.altars_per_flame_level.element" = "Autels au niveau de Flamme {n}"
"config.count.altars_per_flame_level.doc" = "Autels permis à ce niveau de Flamme, de 1 à 255. Le niveau 0 précède le niveau de Flamme 1, où commence un nouveau monde ; les niveaux au-delà de la liste prennent sa dernière valeur. Sans mods : 1, 2, 4, 6, 8, 10, 11, 12, 13, 14, 15, 16. Les joueurs sur un serveur utilisent la table du serveur."
"config.count.bases" = "Bases"
"config.count.bases.doc" = "Bases qu'un monde contient, de 16 à 179. Les autels dont les zones se touchent partagent une base ; un autel qui commencerait une base de plus est refusé. Un changement s'applique au prochain lancement du jeu."
"config.zones" = "Zones d'autels"
"config.zones.doc" = "Comment les zones des Autels de la Flamme qui se touchent grandissent et se rejoignent."
"config.zones.clusters" = "Les zones qui se touchent grandissent ensemble"
"config.zones.clusters.doc" = "Les autels dont les zones se touchent grandissent ensemble et partagent leur surface. Chaque monde applique sa propre valeur à son chargement."
"config.zones.building_across_seams" = "Construire sur les jointures"
"config.zones.building_across_seams.doc" = "Les éléments peuvent être posés à cheval sur la jointure entre deux zones d'un même groupe. Les joueurs sur un serveur utilisent la valeur du serveur."
"hold.past" = "Le monde a {zones} zones d'autel dans {bases} bases, au-delà des {vanilla_zones} zones dans {vanilla_bases} bases du jeu de base. Sans Better Altars, les autels au-delà perdent leurs fonctions de base."
"off.grouping" = "Ce monde est retenu à cause de ses zones d'autel, et cette version du jeu les regroupe d'une façon que Better Altars ne connaît pas."
"off.thread" = "Better Altars n'a pas pu commencer à surveiller les autels : {error}."

[it]
