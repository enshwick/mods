[package]
name = "enshwick-build-camera"
version = "0.0.0-dev"
description = "Airborne Architect's building fly mode for every player, within the vanilla limits"
keywords = ["enshrouded", "mod", "building", "camera"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/build-camera"
publish = false

[package.metadata.enshwick]
id = "enshwick.build-camera"
side = "both"
name = "Build Camera"
join = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
