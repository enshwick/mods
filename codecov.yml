coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

github_checks:
  annotations: false

# Test files; inline test modules still count, since stable Rust cannot mark
# them out.
ignore:
  - "**/tests/**"
  - "**/tests.rs"
  - fuzz/**
  - tools/**
