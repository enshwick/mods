[package]
name = "enshwick-probe"
version = "0.1.0"
description = "Development only, never shipped: exercises the platform API on a test server and logs what it sees"
keywords = ["enshrouded", "mod", "server", "testing"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/devtools/enshwick-probe"
publish = false

[package.metadata.enshwick]
id = "enshwick.probe"
side = "server"
name = "Probe"
developer = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }

[lints]
workspace = true
