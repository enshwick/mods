[package]
name = "enshwick-probe"
version = "0.1.0"
description = "Development only, never shipped: exercises the platform API on a test server and logs what it sees"
keywords = ["enshrouded", "mod", "server", "testing"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/devtools/enshwick-probe"
publish = false

[package.metadata.enshwick]
id = "enshwick.probe"
side = "server"
name = "Probe"
developer = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["typed", "unstable"] }
enshwick-luau.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true, features = ["parse", "serde"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "typed", "unstable"] }

[lints]
workspace = true
