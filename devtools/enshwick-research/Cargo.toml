[package]
name = "enshwick-research"
version = "0.1.0"
description = "Development only, never shipped: logs what a running client does where the platform still needs engine facts"
keywords = ["enshrouded", "mod", "client", "research"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/devtools-mods"
homepage = "https://github.com/enshwick/devtools-mods/tree/main/enshwick-research"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = "1.0.0-alpha.3"
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
enshwick-gamedata = "1.0.0-alpha.3"

[lints]
workspace = true

[package.metadata.enshwick]
release = false
windows-only = true
