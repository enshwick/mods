[package]
name = "enshwick-research"
version = "0.1.0"
description = "Development only, never shipped: logs what a running client does where the platform still needs engine facts"
keywords = ["enshrouded", "mod", "client", "research"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/devtools/enshwick-research"
publish = false

[package.metadata.enshwick]
id = "enshwick.research"
side = "server"
name = "Research"
developer = true

[package.metadata.xtask]
windows-only = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }
rustc-hash.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
enshwick-gamedata.workspace = true

[lints]
workspace = true
