[package]
name = "enshwick-test-ui"
version = "0.1.0"
description = "Development only, never shipped: screen extensions, sounds and input reads for checking the platform's interface in game"
keywords = ["enshrouded", "mod", "testing"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/devtools/enshwick-test-ui"
publish = false

[package.metadata.enshwick]
id = "enshwick.test-ui"
side = "both"
name = "Test UI"
developer = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["typed", "unstable"] }
toml = { version = "=1.2.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "typed", "unstable"] }

[lints]
workspace = true
