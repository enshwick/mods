# The fuzz targets, a workspace of their own: cargo-fuzz builds them with the
# nightly compiler and sanitizer flags, which the main workspace never sees.
# `cargo +nightly fuzz run <target>` runs one.
[package]
name = "enshwick-mods-fuzz"
version = "0.0.0"
description = "libFuzzer targets for what the mods read from the network"
edition = "2024"
license = "MIT"
repository = "https://github.com/enshwick/mods"
publish = false

[package.metadata]
cargo-fuzz = true

# The packet module a target compiles with `#[path]` uses it.
[package.metadata.cargo-machete]
ignored = ["thiserror"]

[dependencies]
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"] }

thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

[[bin]]
name = "rcon_packets"
path = "fuzz_targets/rcon_packets.rs"
test = false
doc = false
bench = false

[lints]
workspace = true

[workspace]
members = ["."]

# The same lints as the main workspace.
[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
missing_abi = "deny"
non_ascii_idents = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unexpected_cfgs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# cargo-deny owns duplicate versions.
multiple_crate_versions = "allow"
assert_is_empty = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"
