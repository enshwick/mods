[package]
name = "enshwick-game-rates"
version = "0.1.0"
description = "Building recipes make more, furniture gives more comfort, and experience, workshops, loot and skill points each have a multiplier"
keywords = ["enshrouded", "mod", "rates", "recipes", "comfort"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/game-rates"
publish = false

[package.metadata.enshwick]
id = "enshwick.game-rates"
side = "both"
name = "Game Rates"
join = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }

[lints]
workspace = true
