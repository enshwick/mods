[en]
"mod.name" = "Game Rates"
"mod.description" = "Rates for building recipes, furniture comfort, experience, workshop speed, loot and skill points."
"config" = "Game Rates"
"config.recipes" = "Building recipes"
"config.recipes.doc" = "How much more the building recipes make, and of what."
"config.recipes.multiplier" = "Output"
"config.recipes.multiplier.doc" = "How many times the building recipes make for the same cost, from 2 to 100. A joined player runs with the server's value."
"config.recipes.blocks" = "Blocks and roofs"
"config.recipes.blocks.doc" = "Building blocks and roofs make more."
"config.recipes.overgrowth" = "Overgrowth"
"config.recipes.overgrowth.doc" = "Overgrowth materials make more."
"config.recipes.decor" = "Decor and furniture"
"config.recipes.decor.doc" = "Decor and furniture make more."
"config.comfort" = "Furniture comfort"
"config.comfort.doc" = "How much comfort furniture gives inside a base."
"config.comfort.multiplier" = "Multiplier"
"config.comfort.multiplier.doc" = "Comfort of each piece of furniture inside a base, times this, from 0 to 100: 1 is vanilla, 0 takes all comfort from furniture."
"config.experience" = "Experience"
"config.experience.doc" = "Experience by where it comes from, each times its multiplier. The server's values decide."
"config.experience.combat" = "Combat XP"
"config.experience.combat.doc" = "Experience from combat, times this, from 0 to 100: 1 is vanilla."
"config.experience.mining" = "Mining XP"
"config.experience.mining.doc" = "Experience from mining resources, times this, from 0 to 100: 1 is vanilla."
"config.experience.exploration" = "Quest & Exploration XP"
"config.experience.exploration.doc" = "Experience from exploring, lore, quests and item sets, times this, from 0 to 100: 1 is vanilla."
"config.workshops" = "Workshops"
"config.workshops.doc" = "Timed workshops such as the smelter and the kiln."
"config.workshops.speed" = "Workshop Production Speed"
"config.workshops.speed.doc" = "How fast workshops produce, from 0.1 to 100: 2 halves the time, 1 is vanilla. A joined player runs with the server's value."
"config.drops" = "Loot"
"config.drops.doc" = "How much resources and loot hand out. The server's values decide."
"config.drops.resources" = "Loot Amount"
"config.drops.resources.doc" = "Materials in each loot stack and resource drop, times this, from 0 to 100, as the game's own Loot Amount does: 1 is vanilla."
"config.drops.loot" = "Loot stacks"
"config.drops.loot.doc" = "Each stack of loot in chests, corpses and animals, times this, from 0 to 100, at most a full stack: 1 is vanilla."
"config.skills" = "Skill points"
"config.skills.doc" = "How many skill points a level gives."
"config.skills.points" = "Skill points per level"
"config.skills.points.doc" = "Skill points each level gives, times this and rounded, from 0 to 100: 1 is vanilla. Points from knowledge stay. A joined player runs with the server's value."

