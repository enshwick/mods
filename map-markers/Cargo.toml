[package]
name = "enshwick-map-markers"
version = "0.1.0"
description = "The loot chests and resources around you, on your map"
keywords = ["enshrouded", "mod", "map", "markers"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/map-markers"
publish = false

[package.metadata.enshwick]
id = "enshwick.map-markers"
side = "both"
name = "Map Markers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
postcard = { version = "=1.2.0", default-features = false, features = ["alloc"] }
toml = { workspace = true, features = ["parse", "display", "serde"] }

[lints]
workspace = true
