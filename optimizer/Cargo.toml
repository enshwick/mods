[package]
name = "enshwick-optimizer"
version = "0.1.1"
description = "A dedicated server uses less CPU, on Windows and under Wine or Proton"
keywords = ["enshrouded", "mod", "wine", "proton", "performance"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/optimizer"
publish = false

[package.metadata.enshwick]
id = "enshwick.optimizer"
side = "server"
name = "Optimizer"

[package.metadata.xtask]
windows-only = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
toml = { workspace = true, features = ["parse", "display", "serde"] }

[lints]
workspace = true
