[package]
name = "enshwick-optimizer"
version = "0.1.0"
description = "A dedicated server uses less CPU, on Windows and under Wine or Proton"
keywords = ["enshrouded", "mod", "wine", "proton", "performance"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/optimizer"
publish = false

[package.metadata.enshwick]
id = "enshwick.optimizer"
side = "both"
name = "Optimizer"

[package.metadata.xtask]
windows-only = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick.workspace = true
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
