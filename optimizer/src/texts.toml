[en]
"mod.name" = "Optimizer"
"mod.description" = "A dedicated server uses less CPU, on Windows and under Wine or Proton."
"config" = "Optimizer"
"config.exact_waits" = "Exact waits"
"config.exact_waits.doc" = "Short waits in the game's event loop sleep instead of polling. Auto: where they were measured to help. On: everywhere, the game included. Off: never. Turning them on takes effect at the next start when they were off at start."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "On"
"config.exact_waits.off" = "Off"
"config.task_workers" = "Task workers"
"config.task_workers.doc" = "The most worker threads each task group of the dedicated server starts, 1 to 64. 0 is automatic: the container's CPU limit under Wine, else as many as the game picks. Takes effect when the server starts again."
"config.server_wait_cap_ms" = "Server wait cap, ms"
"config.server_wait_cap_ms.doc" = "The longest the server's game loop waits between its passes while players are online, 1 to 8 ms, never past the next simulation step. 1 is vanilla. Check gliding, joining and combat before keeping more. Raising it from 1 takes effect at the next start when the game started with it at 1 and measure mode off."
"config.measure" = "Measure mode"
"config.measure.doc" = "A line a minute in the log and the status summary: CPU by thread group, loop and step rates, exact waits and the server's Bad Performance warnings."

[uk]
"mod.name" = "Optimizer"
"mod.description" = "Виділений сервер витрачає менше CPU, на Windows і під Wine чи Proton."
"config" = "Optimizer"
"config.exact_waits" = "Точні очікування"
"config.exact_waits.doc" = "Короткі очікування в циклі подій гри сплять, а не опитують. Авто: там, де вимірювання показали користь. Увімкнено: всюди, і в грі. Вимкнено: ніде. Увімкнення діє з наступного запуску, якщо на старті вони були вимкнені."
"config.exact_waits.auto" = "Авто"
"config.exact_waits.on" = "Увімкнено"
"config.exact_waits.off" = "Вимкнено"
"config.task_workers" = "Робочі потоки"
"config.task_workers.doc" = "Найбільше робочих потоків, які запускає кожна група завдань виділеного сервера, від 1 до 64. 0 означає автоматично: ліміт CPU контейнера під Wine, інакше стільки, скільки вибере гра. Діє після перезапуску сервера."
"config.server_wait_cap_ms" = "Межа очікування сервера, мс"
"config.server_wait_cap_ms.doc" = "Найдовше очікування ігрового циклу сервера між проходами, поки на ньому є гравці, від 1 до 8 мс, ніколи не довше за наступний крок симуляції. 1 як у грі. Перш ніж лишати більше, перевірте політ на планері, приєднання й бій. Підвищення з 1 діє з наступного запуску, якщо гра стартувала з 1 і вимкненим режимом вимірювань."
"config.measure" = "Режим вимірювань"
"config.measure.doc" = "Рядок щохвилини в журналі та у зведенні стану: CPU за групами потоків, частота циклу й кроків, точні очікування та попередження сервера Bad Performance."

[de]
"mod.name" = "Optimizer"
"mod.description" = "Ein dedizierter Server braucht weniger CPU, unter Windows und unter Wine oder Proton."
"config" = "Optimizer"
"config.exact_waits" = "Exakte Wartezeiten"
"config.exact_waits.doc" = "Kurze Wartezeiten in der Ereignisschleife des Spiels schlafen, statt abzufragen. Auto: wo Messungen einen Nutzen zeigten. An: überall, auch im Spiel. Aus: nie. Das Einschalten gilt ab dem nächsten Start, wenn sie beim Start aus waren."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "An"
"config.exact_waits.off" = "Aus"
"config.task_workers" = "Arbeitsthreads"
"config.task_workers.doc" = "Die meisten Arbeitsthreads, die jede Aufgabengruppe des dedizierten Servers startet, 1 bis 64. 0 ist automatisch: das CPU-Limit des Containers unter Wine, sonst so viele, wie das Spiel wählt. Gilt ab dem nächsten Serverstart."
"config.server_wait_cap_ms" = "Server-Wartegrenze, ms"
"config.server_wait_cap_ms.doc" = "Die längste Wartezeit der Spielschleife des Servers zwischen ihren Durchläufen, solange Spieler online sind, 1 bis 8 ms, nie über den nächsten Simulationsschritt hinaus. 1 entspricht dem Grundspiel. Prüfe Gleiten, Beitreten und Kampf, bevor du mehr behältst. Eine Erhöhung von 1 gilt ab dem nächsten Start, wenn das Spiel mit 1 und ausgeschaltetem Messmodus gestartet ist."
"config.measure" = "Messmodus"
"config.measure.doc" = "Eine Zeile pro Minute im Log und in der Statusübersicht: CPU nach Threadgruppe, Schleifen- und Schrittraten, exakte Wartezeiten und die Bad-Performance-Warnungen des Servers."

[fr]
"mod.name" = "Optimizer"
"mod.description" = "Un serveur dédié utilise moins de CPU, sous Windows et sous Wine ou Proton."
"config" = "Optimizer"
"config.exact_waits" = "Attentes exactes"
"config.exact_waits.doc" = "Les attentes courtes de la boucle d'événements du jeu dorment au lieu d'interroger. Auto : là où les mesures ont montré un gain. Activé : partout, jeu compris. Désactivé : jamais. Les activer prend effet au prochain lancement si elles étaient désactivées au lancement."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "Activé"
"config.exact_waits.off" = "Désactivé"
"config.task_workers" = "Threads de travail"
"config.task_workers.doc" = "Le nombre maximal de threads de travail que lance chaque groupe de tâches du serveur dédié, de 1 à 64. 0 est automatique : la limite de CPU du conteneur sous Wine, sinon autant que le jeu en choisit. Prend effet au prochain lancement du serveur."
"config.server_wait_cap_ms" = "Attente max. du serveur, ms"
"config.server_wait_cap_ms.doc" = "L'attente la plus longue de la boucle de jeu du serveur entre ses passages tant que des joueurs sont en ligne, de 1 à 8 ms, jamais au-delà de la prochaine étape de simulation. 1 correspond au jeu de base. Vérifiez le vol plané, les connexions et le combat avant de garder plus. L'augmenter depuis 1 prend effet au prochain lancement si le jeu a démarré avec 1 et le mode mesure désactivé."
"config.measure" = "Mode mesure"
"config.measure.doc" = "Une ligne par minute dans le journal et le résumé d'état : CPU par groupe de threads, fréquences de boucle et d'étape, attentes exactes et avertissements Bad Performance du serveur."

[it]
"mod.name" = "Optimizer"
"mod.description" = "Un server dedicato usa meno CPU, su Windows e sotto Wine o Proton."
"config" = "Optimizer"
"config.exact_waits" = "Attese esatte"
"config.exact_waits.doc" = "Le attese brevi nel ciclo degli eventi del gioco dormono invece di interrogare. Auto: dove le misure hanno mostrato un vantaggio. Attivo: ovunque, gioco compreso. Disattivo: mai. Attivarle vale dal prossimo avvio se all'avvio erano disattivate."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "Attivo"
"config.exact_waits.off" = "Disattivo"
"config.task_workers" = "Thread di lavoro"
"config.task_workers.doc" = "Il numero massimo di thread di lavoro che ogni gruppo di attività del server dedicato avvia, da 1 a 64. 0 è automatico: il limite di CPU del container sotto Wine, altrimenti quanti ne sceglie il gioco. Vale dal prossimo avvio del server."
"config.server_wait_cap_ms" = "Attesa massima del server, ms"
"config.server_wait_cap_ms.doc" = "L'attesa più lunga del ciclo di gioco del server tra un passaggio e l'altro mentre ci sono giocatori online, da 1 a 8 ms, mai oltre il prossimo passo di simulazione. 1 è il gioco base. Controlla planata, accesso e combattimento prima di tenere di più. Alzarla da 1 vale dal prossimo avvio se il gioco è partito con 1 e la modalità misura disattivata."
"config.measure" = "Modalità misura"
"config.measure.doc" = "Una riga al minuto nel log e nel riepilogo di stato: CPU per gruppo di thread, frequenze di ciclo e di passo, attese esatte e avvisi Bad Performance del server."

[es]
"mod.name" = "Optimizer"
"mod.description" = "Un servidor dedicado usa menos CPU, en Windows y bajo Wine o Proton."
"config" = "Optimizer"
"config.exact_waits" = "Esperas exactas"
"config.exact_waits.doc" = "Las esperas cortas del bucle de eventos del juego duermen en vez de sondear. Auto: donde las mediciones mostraron que ayudan. Activado: en todas partes, también en el juego. Desactivado: nunca. Activarlas se aplica en el próximo inicio si estaban desactivadas al iniciar."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "Activado"
"config.exact_waits.off" = "Desactivado"
"config.task_workers" = "Hilos de trabajo"
"config.task_workers.doc" = "El máximo de hilos de trabajo que inicia cada grupo de tareas del servidor dedicado, de 1 a 64. 0 es automático: el límite de CPU del contenedor bajo Wine; si no, tantos como elija el juego. Se aplica cuando el servidor vuelve a iniciarse."
"config.server_wait_cap_ms" = "Espera máxima del servidor, ms"
"config.server_wait_cap_ms.doc" = "La espera más larga del bucle de juego del servidor entre sus pasadas mientras hay jugadores conectados, de 1 a 8 ms, nunca más allá del siguiente paso de simulación. 1 es el juego base. Comprueba el planeo, la conexión y el combate antes de dejar más. Subirla desde 1 se aplica en el próximo inicio si el juego inició con 1 y el modo de medición desactivado."
"config.measure" = "Modo de medición"
"config.measure.doc" = "Una línea por minuto en el registro y en el resumen de estado: CPU por grupo de hilos, frecuencias de bucle y de paso, esperas exactas y los avisos Bad Performance del servidor."

[ru]
"mod.name" = "Optimizer"
"mod.description" = "Выделенный сервер тратит меньше CPU, на Windows и под Wine или Proton."
"config" = "Optimizer"
"config.exact_waits" = "Точные ожидания"
"config.exact_waits.doc" = "Короткие ожидания в цикле событий игры спят, а не опрашивают. Авто: там, где замеры показали пользу. Вкл.: везде, в том числе в игре. Выкл.: нигде. Включение действует со следующего запуска, если при запуске они были выключены."
"config.exact_waits.auto" = "Авто"
"config.exact_waits.on" = "Вкл."
"config.exact_waits.off" = "Выкл."
"config.task_workers" = "Рабочие потоки"
"config.task_workers.doc" = "Наибольшее число рабочих потоков, которые запускает каждая группа задач выделенного сервера, от 1 до 64. 0 означает автоматически: лимит CPU контейнера под Wine, иначе столько, сколько выберет игра. Действует после перезапуска сервера."
"config.server_wait_cap_ms" = "Предел ожидания сервера, мс"
"config.server_wait_cap_ms.doc" = "Самое долгое ожидание игрового цикла сервера между проходами, пока на нём есть игроки, от 1 до 8 мс, никогда не дольше следующего шага симуляции. 1 как в обычной игре. Прежде чем оставить больше, проверьте планирование, подключение и бой. Повышение с 1 действует со следующего запуска, если игра запустилась с 1 и выключенным режимом замеров."
"config.measure" = "Режим замеров"
"config.measure.doc" = "Строка в минуту в журнале и в сводке состояния: CPU по группам потоков, частота цикла и шагов, точные ожидания и предупреждения сервера Bad Performance."

[pl]
"mod.name" = "Optimizer"
"mod.description" = "Serwer dedykowany zużywa mniej CPU, w Windows oraz pod Wine lub Proton."
"config" = "Optimizer"
"config.exact_waits" = "Dokładne oczekiwania"
"config.exact_waits.doc" = "Krótkie oczekiwania w pętli zdarzeń gry śpią zamiast odpytywać. Auto: tam, gdzie pomiary wykazały korzyść. Wł.: wszędzie, także w grze. Wył.: nigdy. Włączenie działa od następnego uruchomienia, jeśli przy starcie były wyłączone."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "Wł."
"config.exact_waits.off" = "Wył."
"config.task_workers" = "Wątki robocze"
"config.task_workers.doc" = "Najwięcej wątków roboczych, które uruchamia każda grupa zadań serwera dedykowanego, od 1 do 64. 0 to automatycznie: limit CPU kontenera pod Wine, w innym razie tyle, ile wybierze gra. Działa po ponownym uruchomieniu serwera."
"config.server_wait_cap_ms" = "Limit oczekiwania serwera, ms"
"config.server_wait_cap_ms.doc" = "Najdłuższe oczekiwanie pętli gry serwera między przebiegami, gdy gracze są online, od 1 do 8 ms, nigdy dłużej niż do następnego kroku symulacji. 1 to podstawowa gra. Zanim zostawisz więcej, sprawdź szybowanie, dołączanie i walkę. Podniesienie z 1 działa od następnego uruchomienia, jeśli gra wystartowała z 1 i wyłączonym trybem pomiaru."
"config.measure" = "Tryb pomiaru"
"config.measure.doc" = "Wiersz na minutę w dzienniku i w podsumowaniu stanu: CPU według grup wątków, częstotliwości pętli i kroków, dokładne oczekiwania oraz ostrzeżenia serwera Bad Performance."

[ja]
"mod.name" = "Optimizer"
"mod.description" = "専用サーバーのCPU使用量を減らします。Windowsでも、WineやProton上でも動作します。"
"config" = "Optimizer"
"config.exact_waits" = "正確な待機"
"config.exact_waits.doc" = "ゲームのイベントループ内の短い待機を、ポーリングではなくスリープで行います。自動：測定で効果があった場所のみ。オン：ゲームを含むすべての場所。オフ：使用しません。起動時にオフだった場合、オンにした設定は次回の起動から反映されます。"
"config.exact_waits.auto" = "自動"
"config.exact_waits.on" = "オン"
"config.exact_waits.off" = "オフ"
"config.task_workers" = "ワーカースレッド"
"config.task_workers.doc" = "専用サーバーの各タスクグループが起動するワーカースレッドの最大数（1～64）。0は自動です：Wine上ではコンテナのCPU制限、それ以外ではゲームが選ぶ数になります。サーバーの再起動後に反映されます。"
"config.server_wait_cap_ms" = "サーバー待機の上限（ミリ秒）"
"config.server_wait_cap_ms.doc" = "プレイヤーがオンラインの間、サーバーのゲームループが処理の合間に待機する最長時間（1～8ミリ秒）。次のシミュレーションステップを超えることはありません。1は通常のゲームと同じです。大きな値のままにする前に、滑空、参加、戦闘を確認してください。ゲームが1かつ測定モードオフで起動していた場合、1から上げた値は次回の起動から反映されます。"
"config.measure" = "測定モード"
"config.measure.doc" = "ログとステータス概要に1分ごとに1行：スレッドグループ別のCPU、ループとステップの頻度、正確な待機、サーバーのBad Performance警告。"

[ko]
"mod.name" = "Optimizer"
"mod.description" = "전용 서버가 Windows와 Wine 또는 Proton에서 CPU를 덜 사용합니다."
"config" = "Optimizer"
"config.exact_waits" = "정밀 대기"
"config.exact_waits.doc" = "게임 이벤트 루프의 짧은 대기를 폴링 대신 슬립으로 처리합니다. 자동: 측정에서 효과가 확인된 곳에서만. 켜기: 게임을 포함한 모든 곳. 끄기: 사용 안 함. 시작할 때 꺼져 있었다면 켠 설정은 다음 시작부터 적용됩니다."
"config.exact_waits.auto" = "자동"
"config.exact_waits.on" = "켜기"
"config.exact_waits.off" = "끄기"
"config.task_workers" = "작업 스레드"
"config.task_workers.doc" = "전용 서버의 각 작업 그룹이 시작하는 작업 스레드의 최대 수입니다. 1~64. 0은 자동입니다. Wine에서는 컨테이너의 CPU 제한, 그 외에는 게임이 정한 수입니다. 서버를 다시 시작하면 적용됩니다."
"config.server_wait_cap_ms" = "서버 대기 상한(ms)"
"config.server_wait_cap_ms.doc" = "플레이어가 접속해 있는 동안 서버 게임 루프가 처리 사이에 대기하는 최대 시간입니다. 1~8ms이며, 다음 시뮬레이션 단계를 넘지 않습니다. 1은 기본 게임과 같습니다. 더 큰 값을 유지하기 전에 활공, 접속, 전투를 확인하세요. 게임이 1이고 측정 모드가 꺼진 상태로 시작했다면, 1에서 올린 값은 다음 시작부터 적용됩니다."
"config.measure" = "측정 모드"
"config.measure.doc" = "로그와 상태 요약에 1분마다 한 줄: 스레드 그룹별 CPU, 루프와 단계 빈도, 정밀 대기, 서버의 Bad Performance 경고."

[pt-br]
"mod.name" = "Optimizer"
"mod.description" = "Um servidor dedicado usa menos CPU, no Windows e no Wine ou Proton."
"config" = "Optimizer"
"config.exact_waits" = "Esperas exatas"
"config.exact_waits.doc" = "Esperas curtas no loop de eventos do jogo dormem em vez de consultar. Auto: onde as medições mostraram ganho. Ligado: em todo lugar, inclusive no jogo. Desligado: nunca. Ligá-las vale a partir do próximo início se estavam desligadas no início."
"config.exact_waits.auto" = "Auto"
"config.exact_waits.on" = "Ligado"
"config.exact_waits.off" = "Desligado"
"config.task_workers" = "Threads de trabalho"
"config.task_workers.doc" = "O máximo de threads de trabalho que cada grupo de tarefas do servidor dedicado inicia, de 1 a 64. 0 é automático: o limite de CPU do contêiner no Wine; fora dele, quantas o jogo escolher. Vale quando o servidor iniciar de novo."
"config.server_wait_cap_ms" = "Espera máxima do servidor, ms"
"config.server_wait_cap_ms.doc" = "A espera mais longa do loop de jogo do servidor entre suas passadas enquanto há jogadores online, de 1 a 8 ms, nunca além do próximo passo da simulação. 1 é o jogo base. Verifique planar, entrar e combater antes de manter mais. Aumentar a partir de 1 vale no próximo início se o jogo iniciou com 1 e o modo de medição desligado."
"config.measure" = "Modo de medição"
"config.measure.doc" = "Uma linha por minuto no log e no resumo de status: CPU por grupo de threads, taxas de loop e de passo, esperas exatas e os avisos Bad Performance do servidor."

[th]
"mod.name" = "Optimizer"
"mod.description" = "เซิร์ฟเวอร์เฉพาะใช้ CPU น้อยลง ทั้งบน Windows และใต้ Wine หรือ Proton"
"config" = "Optimizer"
"config.exact_waits" = "การรอแบบแม่นยำ"
"config.exact_waits.doc" = "การรอสั้น ๆ ในลูปเหตุการณ์ของเกมจะพักแทนการตรวจซ้ำ อัตโนมัติ: เฉพาะที่การวัดพบว่าช่วยได้ เปิด: ทุกที่ รวมถึงในเกม ปิด: ไม่ใช้เลย การเปิดจะมีผลเมื่อเริ่มครั้งถัดไป หากตอนเริ่มปิดอยู่"
"config.exact_waits.auto" = "อัตโนมัติ"
"config.exact_waits.on" = "เปิด"
"config.exact_waits.off" = "ปิด"
"config.task_workers" = "เธรดทำงาน"
"config.task_workers.doc" = "จำนวนเธรดทำงานสูงสุดที่แต่ละกลุ่มงานของเซิร์ฟเวอร์เฉพาะเริ่ม ตั้งแต่ 1 ถึง 64 ค่า 0 คืออัตโนมัติ: ขีดจำกัด CPU ของคอนเทนเนอร์เมื่ออยู่ใต้ Wine ไม่เช่นนั้นตามที่เกมเลือก มีผลเมื่อเริ่มเซิร์ฟเวอร์ใหม่"
"config.server_wait_cap_ms" = "ขีดจำกัดการรอของเซิร์ฟเวอร์ (มิลลิวินาที)"
"config.server_wait_cap_ms.doc" = "เวลารอนานที่สุดของลูปเกมของเซิร์ฟเวอร์ระหว่างรอบ ขณะที่มีผู้เล่นออนไลน์ ตั้งแต่ 1 ถึง 8 มิลลิวินาที และไม่เกินขั้นจำลองถัดไป ค่า 1 เหมือนเกมปกติ ตรวจสอบการร่อน การเข้าร่วม และการต่อสู้ก่อนใช้ค่าที่สูงกว่า การเพิ่มจาก 1 จะมีผลเมื่อเริ่มครั้งถัดไป หากเกมเริ่มด้วยค่า 1 และปิดโหมดวัดผล"
"config.measure" = "โหมดวัดผล"
"config.measure.doc" = "หนึ่งบรรทัดต่อนาทีในล็อกและสรุปสถานะ: CPU ตามกลุ่มเธรด อัตราลูปและขั้น การรอแบบแม่นยำ และคำเตือน Bad Performance ของเซิร์ฟเวอร์"

[tr]
"mod.name" = "Optimizer"
"mod.description" = "Adanmış sunucu Windows'ta ve Wine ya da Proton altında daha az CPU kullanır."
"config" = "Optimizer"
"config.exact_waits" = "Tam beklemeler"
"config.exact_waits.doc" = "Oyunun olay döngüsündeki kısa beklemeler yoklamak yerine uyur. Otomatik: ölçümlerin fayda gösterdiği yerlerde. Açık: oyun dahil her yerde. Kapalı: hiçbir zaman. Başlangıçta kapalıysa açmak bir sonraki başlatmada geçerli olur."
"config.exact_waits.auto" = "Otomatik"
"config.exact_waits.on" = "Açık"
"config.exact_waits.off" = "Kapalı"
"config.task_workers" = "İşçi iş parçacıkları"
"config.task_workers.doc" = "Adanmış sunucunun her görev grubunun başlattığı en fazla işçi iş parçacığı, 1 ile 64 arası. 0 otomatiktir: Wine altında konteynerin CPU sınırı, aksi halde oyunun seçtiği kadar. Sunucu yeniden başlayınca geçerli olur."
"config.server_wait_cap_ms" = "Sunucu bekleme sınırı, ms"
"config.server_wait_cap_ms.doc" = "Oyuncular çevrimiçiyken sunucunun oyun döngüsünün geçişleri arasında beklediği en uzun süre, 1 ile 8 ms arası, asla bir sonraki simülasyon adımını geçmez. 1 temel oyundur. Daha yüksek bir değerde kalmadan önce süzülmeyi, katılmayı ve savaşı kontrol edin. 1'den yükseltmek, oyun 1 ile ve ölçüm modu kapalı başladıysa bir sonraki başlatmada geçerli olur."
"config.measure" = "Ölçüm modu"
"config.measure.doc" = "Günlükte ve durum özetinde dakikada bir satır: iş parçacığı grubuna göre CPU, döngü ve adım hızları, tam beklemeler ve sunucunun Bad Performance uyarıları."

[zh-cn]
"mod.name" = "Optimizer"
"mod.description" = "专用服务器占用更少的 CPU，适用于 Windows 以及 Wine 或 Proton。"
"config" = "Optimizer"
"config.exact_waits" = "精确等待"
"config.exact_waits.doc" = "游戏事件循环中的短等待改为休眠，而不是轮询。自动：仅在测量显示有效的地方。开：所有地方，包括游戏。关：从不。若启动时为关，开启后将在下次启动时生效。"
"config.exact_waits.auto" = "自动"
"config.exact_waits.on" = "开"
"config.exact_waits.off" = "关"
"config.task_workers" = "工作线程"
"config.task_workers.doc" = "专用服务器每个任务组启动的最多工作线程数，1 到 64。0 为自动：在 Wine 下为容器的 CPU 限制，否则由游戏决定。服务器重新启动后生效。"
"config.server_wait_cap_ms" = "服务器等待上限（毫秒）"
"config.server_wait_cap_ms.doc" = "有玩家在线时，服务器游戏循环在两次处理之间等待的最长时间，1 到 8 毫秒，绝不超过下一个模拟步。1 与原版游戏相同。保留更大的值前，请检查滑翔、加入和战斗。若游戏以 1 且测量模式关闭启动，从 1 调高将在下次启动时生效。"
"config.measure" = "测量模式"
"config.measure.doc" = "每分钟在日志和状态摘要中写一行：按线程组的 CPU、循环和步进频率、精确等待以及服务器的 Bad Performance 警告。"

[zh-tw]
"mod.name" = "Optimizer"
"mod.description" = "專用伺服器佔用更少的 CPU，適用於 Windows 以及 Wine 或 Proton。"
"config" = "Optimizer"
"config.exact_waits" = "精確等待"
"config.exact_waits.doc" = "遊戲事件迴圈中的短等待改為休眠，而不是輪詢。自動：僅在量測顯示有效的地方。開：所有地方，包括遊戲。關：從不。若啟動時為關，開啟後將在下次啟動時生效。"
"config.exact_waits.auto" = "自動"
"config.exact_waits.on" = "開"
"config.exact_waits.off" = "關"
"config.task_workers" = "工作執行緒"
"config.task_workers.doc" = "專用伺服器每個工作群組啟動的最多工作執行緒數，1 到 64。0 為自動：在 Wine 下為容器的 CPU 限制，否則由遊戲決定。伺服器重新啟動後生效。"
"config.server_wait_cap_ms" = "伺服器等待上限（毫秒）"
"config.server_wait_cap_ms.doc" = "有玩家在線時，伺服器遊戲迴圈在兩次處理之間等待的最長時間，1 到 8 毫秒，絕不超過下一個模擬步。1 與原版遊戲相同。保留更大的值前，請檢查滑翔、加入和戰鬥。若遊戲以 1 且量測模式關閉啟動，從 1 調高將在下次啟動時生效。"
"config.measure" = "量測模式"
"config.measure.doc" = "每分鐘在記錄和狀態摘要中寫一行：依執行緒群組的 CPU、迴圈和步進頻率、精確等待以及伺服器的 Bad Performance 警告。"
