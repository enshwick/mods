[package]
name = "enshwick-personal-safes"
version = "0.0.0-dev"
description = "Adds the Safe, a chest that only its owner and the players they allow can open"
keywords = ["enshrouded", "mod", "chest", "safe"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/personal-safes"
publish = false

[package.metadata.enshwick]
id = "enshwick.personal-safes"
side = "both"
name = "Personal Safes"
join = true
exports = ["access"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap = { version = "1.9.3", default-features = false }
enshwick = { workspace = true, features = ["unstable"] }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
