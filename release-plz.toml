# release-plz: each mod's version from the conventional commits that touch
# its folder, so a change to one mod releases only it. The entries without
# `release = false` are the release set: a new loader alpha releases each of
# them, as `cargo xtask pin` adds a line to its changelog, since release-plz
# does not count a changed git `rev` as a change. Every workspace member has
# an entry here; `cargo xtask check` refuses one without. Each mod is tagged
# `<package>-v<version>` and gets its own GitHub release. Its CHANGELOG.md is
# written by hand for players, and `cargo xtask notes` makes the release
# notes from it.

[workspace]
# The mods are not published to crates.io: their versions live in git tags.
git_only = true
publish = false
# `release` runs only by hand, on main, and releases every mod whose version
# has no tag yet, whichever pull request set it: the first alpha of a mod
# never released has no release pull request to wait for. `cargo xtask notes`
# refuses the run first when a mod's notes are not ready.
release_always = true
# release-plz only tags: the `release` workflow makes each GitHub release
# with its notes, as a prerelease until the loader's 1.0. A release made
# right after its tag was pushed got a 422 from GitHub.
git_release_enable = false
changelog_update = false
git_tag_name = "{{ package }}-v{{ version }}"
# Renovate moves the dependencies.
dependencies_update = false
pr_labels = ["release"]
# A pull request title is a conventional commit with a scope.
pr_name = "chore(release): release the mods"
# The pull request body follows the repository's form: outcome bullets.
# The `release-pr` run then closes each bumped mod's changelog on the
# branch with `cargo xtask close` and writes the body again from it.
pr_body = """
## Chores

{% for release in releases -%}
- Released `{{ release.package }}` {{ release.next_version }}{% if release.previous_version and release.previous_version != release.next_version %} (was {{ release.previous_version }}){% endif %}.
{% endfor %}"""

[[package]]
name = "enshwick-admin-tools"
git_release_name = "Admin Tools {{ version }}"

# Until 1.0 only the mods above are released; the ones below keep building
# against main and keep their versions and open changelogs.
[[package]]
name = "enshwick-area-loot"
release = false
git_release_name = "Area Loot {{ version }}"

