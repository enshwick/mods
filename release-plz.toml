# release-plz: each mod's version and CHANGELOG.md from the conventional
# commits that touch its folder, so a change to one mod releases only it.
# Each mod is tagged `<package>-v<version>` and gets its own GitHub release.

[workspace]
# The mods are not published to crates.io: their versions live in git tags.
git_only = true
publish = false
# `release` acts only when the newest commit on main is a merged release pull
# request, so a stray run releases nothing.
release_always = false
# A version with a prerelease part (`0.2.0-alpha.1`) makes a GitHub prerelease.
git_release_type = "auto"
git_tag_name = "{{ package }}-v{{ version }}"
# Renovate moves the dependencies.
dependencies_update = false
pr_labels = ["release"]
# The pull request body follows the repository's form: outcome bullets;
# each CHANGELOG.md in the pull request holds the details.
pr_body = """
## Chores

{% for release in releases -%}
- Released `{{ release.package }}` {{ release.next_version }}{% if release.previous_version and release.previous_version != release.next_version %} (was {{ release.previous_version }}){% endif %}.
{% endfor %}
Each `CHANGELOG.md` in this pull request lists what changed.
"""

[[package]]
name = "enshwick-area-loot"
git_release_name = "Area Loot {{ version }}"

[[package]]
name = "enshwick-better-altars"
git_release_name = "Better Altars {{ version }}"

[[package]]
name = "enshwick-build-camera"
git_release_name = "Build Camera {{ version }}"

[[package]]
name = "enshwick-game-rates"
git_release_name = "Game Rates {{ version }}"

[[package]]
name = "enshwick-optimizer"
git_release_name = "Optimizer {{ version }}"

[[package]]
name = "enshwick-personal-safes"
git_release_name = "Personal Safes {{ version }}"

[[package]]
name = "enshwick-shared-experience"
git_release_name = "Shared Experience {{ version }}"

[[package]]
name = "enshwick-survivors-per-altar"
git_release_name = "Survivors per Altar {{ version }}"

# The developer mods are never shipped: nothing there is versioned or released.
[[package]]
name = "enshwick-probe"
release = false

[[package]]
name = "enshwick-research"
release = false

[[package]]
name = "xtask"
release = false
