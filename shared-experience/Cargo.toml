[package]
name = "enshwick-shared-experience"
version = "0.0.0-dev"
description = "Every character catches up with the one that has the most experience"
keywords = ["enshrouded", "mod", "experience", "level"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/shared-experience"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
