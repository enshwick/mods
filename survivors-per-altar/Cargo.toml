[package]
name = "enshwick-survivors-per-altar"
version = "0.1.0"
description = "A copy of each survivor at every Flame Altar, with a bed at its own altar"
keywords = ["enshrouded", "mod", "survivors", "altar"]
categories = ["game-development"]
readme = "README.md"
authors = ["themaiby"]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/enshwick/mods"
homepage = "https://github.com/enshwick/mods/tree/main/survivors-per-altar"
publish = false

[package.metadata.enshwick]
id = "enshwick.survivors-per-altar"
side = "both"
name = "Survivors per Altar"
join = true
exports = ["copy-limit", "charge-cost"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[lints]
workspace = true
