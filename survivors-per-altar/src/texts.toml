"config.per_altar" = "Kopia przy każdym ołtarzu"
"config.per_altar.doc" = "Kopia każdego ocalałego może stać przy każdym ołtarzu Płomienia, jedna na strefę ołtarza. Wyłączone: ocaleni i kostury działają w tym świecie jak w podstawowej grze. Gracze, którzy dołączają, używają wartości serwera."
"config.copy_staffs" = "Kostury kopii"
"config.copy_staffs.doc" = "Jeden kostur kopii na każdego ocalałego. Każda nowa kopia zużywa ładunek, z ostatnim kostur się zużywa; przeniesienie kopii ołtarza jest darmowe. Wyłączone: nie wypadają i nie działają, a posiadane kostury zostają. Gracze, którzy dołączają, używają wartości serwera."
"config.copy_staff_boss_chance" = "Szansa z bossów"
"config.copy_staff_boss_chance.doc" = "Szansa, że ciało bossa zawiera kostur kopii, od 0 do 1."
"config.copy_staff_locked_chest_chance" = "Szansa z zamkniętych skrzyń"
"config.copy_staff_locked_chest_chance.doc" = "Szansa, że skrzynia wymagająca klucza lub wytrycha zawiera kostur kopii, od 0 do 1."
"config.copy_staff_charges" = "Ładunki, gdy pełny"
"config.copy_staff_charges.doc" = "Ładunki pełnego kostura kopii, od 1 do 100. Zmiana działa po ponownym uruchomieniu gry."
"config.copy_staff_charges_min" = "Najmniej ładunków"
"config.copy_staff_charges_min.doc" = "Najmniej ładunków znalezionego kostura, losowo do pełnej liczby, od 0 do 100. 0: każdy kostur wypada pełny."
"config.copy_staff_charges_min.above_full" = "„Najmniej ładunków” ({min}) nie może przekraczać wartości „Ładunki, gdy pełny” ({full})."
"config.vanilla_staff_places_copies" = "Kostur ocalałego stawia kopie"
"config.vanilla_staff_places_copies.doc" = "Włączone: własny kostur ocalałego stawia kopię przy ołtarzu bez niej i przenosi kopię ołtarza. Wyłączone: przenosi samego ocalałego, jak w podstawowej grze."

[ja]
"mod.name" = "祭壇ごとの生存者"
"mod.description" = "各生存者の複製を、すべての炎の祭壇に置けます。"
"copy.name" = "複製の杖：{survivor}"
"copy.description" = "複製のいない炎の祭壇で：{survivor}の複製を置き、チャージを1つ消費します。最後のチャージで杖はなくなります。祭壇にすでに複製がいる場合は、その複製を無料で移動します。"
"copy.full_charges" = "最大チャージ"
"config" = "祭壇ごとの生存者"
"config.per_altar" = "祭壇ごとに複製"
"config.per_altar.doc" = "各生存者の複製を、すべての炎の祭壇に祭壇ゾーンごとに1体置けます。オフにすると、このワールドの生存者と杖は通常のゲームと同じになります。参加したプレイヤーにはサーバーの値が適用されます。"
"config.copy_staffs" = "複製の杖"
"config.copy_staffs.doc" = "生存者ごとに複製の杖が1本あります。新しい複製を置くたびにチャージを1つ消費し、最後のチャージで杖はなくなります。祭壇の複製の移動は無料です。オフにすると杖はドロップせず使えなくなりますが、持っている杖は残ります。参加したプレイヤーにはサーバーの値が適用されます。"
"config.copy_staff_boss_chance" = "ボスからの確率"
