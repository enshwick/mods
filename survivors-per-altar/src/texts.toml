[en]
"mod.name" = "Survivors per altar"
"mod.description" = "A copy of each survivor may stand at every Flame Altar."
"copy.name" = "Copy staff: {survivor}"
"copy.description" = "At a Flame Altar without one: places a copy of {survivor} there and spends a charge; the last charge uses the staff up. Where the altar has a copy, it moves that copy, free."
"copy.full_charges" = "Charges when full"
"config" = "Survivors per altar"
"config.per_altar" = "A copy at every altar"
"config.per_altar.doc" = "A copy of each survivor may stand at every Flame Altar, one per altar zone. Off, survivors and staffs work as in the base game in this world. Players who join use the server's value."
"config.copy_staffs" = "Copy staffs"
"config.copy_staffs.doc" = "One copy staff per survivor. Each new copy spends a charge, and the last charge uses the staff up; moving an altar's copy is free. Off, they neither drop nor work, and staffs already held stay. Players who join use the server's value."
"config.copy_staff_boss_chance" = "Chance from bosses"
"config.copy_staff_boss_chance.doc" = "The chance a boss's corpse holds a copy staff, from 0 to 1."
"config.copy_staff_locked_chest_chance" = "Chance from locked chests"
"config.copy_staff_locked_chest_chance.doc" = "The chance a chest that needs a key or a lockpick holds a copy staff, from 0 to 1."
"config.copy_staff_charges" = "Charges when full"
"config.copy_staff_charges.doc" = "The charges a full copy staff holds, 1 to 100. A change takes effect when the game starts again."
"config.copy_staff_charges_min" = "Fewest charges"
"config.copy_staff_charges_min.doc" = "The fewest charges a dropped staff holds, at random up to the full count, 0 to 100. 0 drops every staff full."
"config.copy_staff_charges_min.above_full" = "Fewest charges ({min}) cannot be more than Charges when full ({full})."
"config.vanilla_staff_places_copies" = "Survivor's staff places copies"
"config.vanilla_staff_places_copies.doc" = "On, the survivor's own staff places a copy at an altar without one and moves the copy an altar has. Off, it moves the survivor itself, as in the base game."

[uk]
"mod.name" = "Врятовані біля кожного олтаря"
"mod.description" = "Копія кожного вцілілого може стояти біля кожного Олтаря Полумʼя."
"copy.name" = "Посох копії: {survivor}"
"copy.description" = "Біля Олтаря Полумʼя без копії: ставить там копію вцілілого {survivor} і витрачає заряд; з останнім зарядом посох зникає. Де копія вже є, переносить її безплатно."
"copy.full_charges" = "Зарядів, коли повний"
"config" = "Врятовані біля кожного олтаря"
"config.per_altar" = "Копія біля кожного олтаря"
"config.per_altar.doc" = "Копія кожного вцілілого може стояти біля кожного Олтаря Полумʼя, одна на зону олтаря. Якщо вимкнено, вцілілі й посохи в цьому світі працюють як у звичайній грі. Гравці, що приєднуються, мають значення сервера."
"config.copy_staffs" = "Посохи копії"
"config.copy_staffs.doc" = "Один посох копії на кожного вцілілого. Кожна нова копія витрачає заряд, з останнім зарядом посох зникає; переносити копію олтаря можна безплатно. Якщо вимкнено, посохи не випадають і не діють, а наявні лишаються. Гравці, що приєднуються, мають значення сервера."
"config.copy_staff_boss_chance" = "Шанс із босів"
"config.copy_staff_boss_chance.doc" = "Шанс, що в тілі боса буде посох копії, від 0 до 1."
"config.copy_staff_locked_chest_chance" = "Шанс із замкнених скринь"
"config.copy_staff_locked_chest_chance.doc" = "Шанс, що в скрині, яка потребує ключа чи відмички, буде посох копії, від 0 до 1."
"config.copy_staff_charges" = "Зарядів, коли повний"
"config.copy_staff_charges.doc" = "Скільки зарядів має повний посох копії, від 1 до 100. Зміна діє після перезапуску гри."
"config.copy_staff_charges_min" = "Найменше зарядів"
"config.copy_staff_charges_min.doc" = "Найменше зарядів у знайденому посоху, випадково до повного числа, від 0 до 100. 0: кожен посох випадає повним."
"config.copy_staff_charges_min.above_full" = "«Найменше зарядів» ({min}) не може бути більше, ніж «Зарядів, коли повний» ({full})."
"config.vanilla_staff_places_copies" = "Посох вцілілого ставить копії"
"config.vanilla_staff_places_copies.doc" = "Якщо увімкнено, власний посох вцілілого ставить копію біля олтаря без неї й переносить копію, що вже є. Якщо вимкнено, він переносить самого вцілілого, як у звичайній грі."

[de]
"mod.name" = "Überlebende pro Altar"
"mod.description" = "Eine Kopie jedes Überlebenden kann an jedem Flammenaltar stehen."
"copy.name" = "Kopiestab: {survivor}"
"copy.description" = "An einem Flammenaltar ohne Kopie: stellt dort eine Kopie von {survivor} auf und verbraucht eine Ladung; mit der letzten ist der Stab verbraucht. Hat der Altar schon eine Kopie, versetzt er sie kostenlos."
"copy.full_charges" = "Ladungen, wenn voll"
"config" = "Überlebende pro Altar"
"config.per_altar" = "Eine Kopie an jedem Altar"
"config.per_altar.doc" = "Eine Kopie jedes Überlebenden kann an jedem Flammenaltar stehen, eine pro Altarzone. Aus: Überlebende und Stäbe verhalten sich in dieser Welt wie im Grundspiel. Beitretende Spieler nutzen den Wert des Servers."
"config.copy_staffs" = "Kopiestäbe"
"config.copy_staffs.doc" = "Ein Kopiestab pro Überlebendem. Jede neue Kopie verbraucht eine Ladung, mit der letzten ist der Stab verbraucht; die Kopie eines Altars zu versetzen ist kostenlos. Aus: Sie fallen nicht und wirken nicht, Stäbe im Besitz bleiben. Beitretende Spieler nutzen den Wert des Servers."
"config.copy_staff_boss_chance" = "Chance bei Bossen"
"config.copy_staff_boss_chance.doc" = "Die Chance, dass die Leiche eines Bosses einen Kopiestab enthält, von 0 bis 1."
"config.copy_staff_locked_chest_chance" = "Chance in verschlossenen Truhen"
"config.copy_staff_locked_chest_chance.doc" = "Die Chance, dass eine Truhe, die einen Schlüssel oder einen Dietrich braucht, einen Kopiestab enthält, von 0 bis 1."
"config.copy_staff_charges" = "Ladungen, wenn voll"
"config.copy_staff_charges.doc" = "Die Ladungen eines vollen Kopiestabs, 1 bis 100. Eine Änderung gilt ab dem nächsten Spielstart."
"config.copy_staff_charges_min" = "Wenigste Ladungen"
"config.copy_staff_charges_min.doc" = "Die wenigsten Ladungen eines gefundenen Stabs, zufällig bis zur vollen Zahl, 0 bis 100. 0: Jeder Stab ist voll."
"config.copy_staff_charges_min.above_full" = "„Wenigste Ladungen“ ({min}) darf nicht höher sein als „Ladungen, wenn voll“ ({full})."
"config.vanilla_staff_places_copies" = "Stab des Überlebenden stellt Kopien auf"
"config.vanilla_staff_places_copies.doc" = "An: Der eigene Stab des Überlebenden stellt an einem Altar ohne Kopie eine auf und versetzt die Kopie eines Altars. Aus: Er versetzt den Überlebenden selbst, wie im Grundspiel."

[fr]
"mod.name" = "Survivants par autel"
"mod.description" = "Une copie de chaque survivant peut se tenir à chaque autel de la Flamme."
"copy.name" = "Bâton de copie : {survivor}"
"copy.description" = "Près d'un autel de la Flamme sans copie : y place une copie de {survivor} et consomme une charge ; la dernière consomme le bâton. Si l'autel a déjà une copie, il la déplace gratuitement."
"copy.full_charges" = "Charges une fois plein"
"config" = "Survivants par autel"
"config.per_altar" = "Une copie à chaque autel"
"config.per_altar.doc" = "Une copie de chaque survivant peut se tenir à chaque autel de la Flamme, une par zone d'autel. Désactivé, survivants et bâtons fonctionnent comme dans le jeu de base dans ce monde. Les joueurs qui rejoignent utilisent la valeur du serveur."
"config.copy_staffs" = "Bâtons de copie"
"config.copy_staffs.doc" = "Un bâton de copie par survivant. Chaque nouvelle copie consomme une charge, et la dernière consomme le bâton ; déplacer la copie d'un autel est gratuit. Désactivés, ils ne tombent plus et ne fonctionnent plus, et les bâtons déjà possédés restent. Les joueurs qui rejoignent utilisent la valeur du serveur."
"config.copy_staff_boss_chance" = "Chance sur les boss"
"config.copy_staff_boss_chance.doc" = "La chance que le corps d'un boss contienne un bâton de copie, de 0 à 1."
"config.copy_staff_locked_chest_chance" = "Chance dans les coffres verrouillés"
"config.copy_staff_locked_chest_chance.doc" = "La chance qu'un coffre qui demande une clé ou un crochet contienne un bâton de copie, de 0 à 1."
"config.copy_staff_charges" = "Charges une fois plein"
"config.copy_staff_charges.doc" = "Les charges d'un bâton de copie plein, de 1 à 100. Un changement prend effet au prochain lancement du jeu."
"config.copy_staff_charges_min" = "Charges minimales"
"config.copy_staff_charges_min.doc" = "Le moins de charges d'un bâton trouvé, au hasard jusqu'au plein, de 0 à 100. 0 : chaque bâton tombe plein."
"config.copy_staff_charges_min.above_full" = "« Charges minimales » ({min}) ne peut pas dépasser « Charges une fois plein » ({full})."
"config.vanilla_staff_places_copies" = "Le bâton du survivant place des copies"
"config.vanilla_staff_places_copies.doc" = "Activé, le bâton du survivant place une copie à un autel qui n'en a pas et déplace la copie d'un autel. Désactivé, il déplace le survivant lui-même, comme dans le jeu de base."

[it]
"mod.name" = "Sopravvissuti per altare"
"mod.description" = "Una copia di ogni sopravvissuto può stare presso ogni Altare della Fiamma."
"copy.name" = "Bastone di copia: {survivor}"
"copy.description" = "Presso un Altare della Fiamma senza copia: vi colloca una copia di {survivor} e consuma una carica; con l'ultima il bastone si esaurisce. Se l'altare ha già una copia, la sposta gratis."
"copy.full_charges" = "Cariche a pieno"
"config" = "Sopravvissuti per altare"
"config.per_altar" = "Una copia per ogni altare"
"config.per_altar.doc" = "Una copia di ogni sopravvissuto può stare presso ogni Altare della Fiamma, una per zona d'altare. Se disattivato, sopravvissuti e bastoni funzionano come nel gioco base in questo mondo. I giocatori che si uniscono usano il valore del server."
"config.copy_staffs" = "Bastoni di copia"
"config.copy_staffs.doc" = "Un bastone di copia per sopravvissuto. Ogni nuova copia consuma una carica e con l'ultima il bastone si esaurisce; spostare la copia di un altare è gratis. Se disattivati, non cadono e non funzionano, e i bastoni già posseduti restano. I giocatori che si uniscono usano il valore del server."
"config.copy_staff_boss_chance" = "Probabilità dai boss"
"config.copy_staff_boss_chance.doc" = "La probabilità che il corpo di un boss contenga un bastone di copia, da 0 a 1."
"config.copy_staff_locked_chest_chance" = "Probabilità dai forzieri chiusi"
"config.copy_staff_locked_chest_chance.doc" = "La probabilità che un forziere che richiede una chiave o un grimaldello contenga un bastone di copia, da 0 a 1."
"config.copy_staff_charges" = "Cariche a pieno"
"config.copy_staff_charges.doc" = "Le cariche di un bastone di copia pieno, da 1 a 100. Una modifica vale dal prossimo avvio del gioco."
"config.copy_staff_charges_min" = "Cariche minime"
"config.copy_staff_charges_min.doc" = "Le cariche minime di un bastone trovato, a caso fino al pieno, da 0 a 100. 0: ogni bastone cade pieno."
"config.copy_staff_charges_min.above_full" = "«Cariche minime» ({min}) non può superare «Cariche a pieno» ({full})."
"config.vanilla_staff_places_copies" = "Il bastone del sopravvissuto colloca copie"
"config.vanilla_staff_places_copies.doc" = "Se attivo, il bastone del sopravvissuto colloca una copia presso un altare che non ne ha e sposta la copia di un altare. Se disattivato, sposta il sopravvissuto stesso, come nel gioco base."

[es]
"mod.name" = "Supervivientes por altar"
"mod.description" = "Una copia de cada superviviente puede estar en cada altar de la Llama."
"copy.name" = "Bastón de copia: {survivor}"
"copy.description" = "En un altar de la Llama sin copia: coloca allí una copia de {survivor} y gasta una carga; con la última se gasta el bastón. Si el altar ya tiene una copia, la mueve gratis."
"copy.full_charges" = "Cargas cuando está lleno"
"config" = "Supervivientes por altar"
"config.per_altar" = "Una copia en cada altar"
"config.per_altar.doc" = "Una copia de cada superviviente puede estar en cada altar de la Llama, una por zona de altar. Desactivado, los supervivientes y los bastones funcionan como en el juego base en este mundo. Los jugadores que se unen usan el valor del servidor."
"config.copy_staffs" = "Bastones de copia"
"config.copy_staffs.doc" = "Un bastón de copia por superviviente. Cada copia nueva gasta una carga y con la última se gasta el bastón; mover la copia de un altar es gratis. Desactivados, no caen ni funcionan, y los bastones que ya se tienen se quedan. Los jugadores que se unen usan el valor del servidor."
"config.copy_staff_boss_chance" = "Probabilidad en jefes"
"config.copy_staff_boss_chance.doc" = "La probabilidad de que el cuerpo de un jefe tenga un bastón de copia, de 0 a 1."
"config.copy_staff_locked_chest_chance" = "Probabilidad en cofres cerrados"
"config.copy_staff_locked_chest_chance.doc" = "La probabilidad de que un cofre que necesita llave o ganzúa tenga un bastón de copia, de 0 a 1."
"config.copy_staff_charges" = "Cargas cuando está lleno"
"config.copy_staff_charges.doc" = "Las cargas de un bastón de copia lleno, de 1 a 100. Un cambio se aplica al volver a iniciar el juego."
"config.copy_staff_charges_min" = "Cargas mínimas"
"config.copy_staff_charges_min.doc" = "Las cargas mínimas de un bastón encontrado, al azar hasta el total, de 0 a 100. 0: cada bastón sale lleno."
"config.copy_staff_charges_min.above_full" = "«Cargas mínimas» ({min}) no puede superar «Cargas cuando está lleno» ({full})."
"config.vanilla_staff_places_copies" = "El bastón del superviviente coloca copias"
"config.vanilla_staff_places_copies.doc" = "Activado, el bastón del propio superviviente coloca una copia en un altar sin ella y mueve la copia de un altar. Desactivado, mueve al superviviente, como en el juego base."

[ru]
"mod.name" = "Выжившие у каждого алтаря"
"mod.description" = "Копия каждого выжившего может стоять у каждого Алтаря пламени."
"copy.name" = "Посох копии: {survivor}"
"copy.description" = "У Алтаря пламени без копии: ставит там копию {survivor} и тратит заряд; с последним зарядом посох исчезает. Если у алтаря уже есть копия, переносит её бесплатно."
"copy.full_charges" = "Зарядов при полном"
"config" = "Выжившие у каждого алтаря"
"config.per_altar" = "Копия у каждого алтаря"
"config.per_altar.doc" = "Копия каждого выжившего может стоять у каждого Алтаря пламени, одна на зону алтаря. Если выключено, выжившие и посохи в этом мире работают как в обычной игре. Подключившиеся игроки используют значение сервера."
"config.copy_staffs" = "Посохи копии"
"config.copy_staffs.doc" = "Один посох копии на каждого выжившего. Каждая новая копия тратит заряд, с последним зарядом посох исчезает; перенос копии алтаря бесплатен. Если выключено, посохи не выпадают и не действуют, а полученные остаются. Подключившиеся игроки используют значение сервера."
"config.copy_staff_boss_chance" = "Шанс с боссов"
"config.copy_staff_boss_chance.doc" = "Шанс, что в теле босса будет посох копии, от 0 до 1."
"config.copy_staff_locked_chest_chance" = "Шанс в запертых сундуках"
"config.copy_staff_locked_chest_chance.doc" = "Шанс, что в сундуке, которому нужен ключ или отмычка, будет посох копии, от 0 до 1."
"config.copy_staff_charges" = "Зарядов при полном"
"config.copy_staff_charges.doc" = "Сколько зарядов у полного посоха копии, от 1 до 100. Изменение действует после перезапуска игры."
"config.copy_staff_charges_min" = "Минимум зарядов"
"config.copy_staff_charges_min.doc" = "Наименьшее число зарядов у найденного посоха, случайно до полного, от 0 до 100. 0: каждый посох выпадает полным."
"config.copy_staff_charges_min.above_full" = "«Минимум зарядов» ({min}) не может быть больше, чем «Зарядов при полном» ({full})."
"config.vanilla_staff_places_copies" = "Посох выжившего ставит копии"
"config.vanilla_staff_places_copies.doc" = "Если включено, собственный посох выжившего ставит копию у алтаря без неё и переносит копию алтаря. Если выключено, он переносит самого выжившего, как в обычной игре."

[pl]
"mod.name" = "Ocaleni przy każdym ołtarzu"
"mod.description" = "Kopia każdego ocalałego może stać przy każdym ołtarzu Płomienia."
"copy.name" = "Kostur kopii: {survivor}"
"copy.description" = "Przy ołtarzu Płomienia bez kopii: stawia tam kopię postaci {survivor} i zużywa ładunek; z ostatnim kostur się zużywa. Gdy ołtarz ma już kopię, przenosi ją za darmo."
"copy.full_charges" = "Ładunki, gdy pełny"
