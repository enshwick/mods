id: entities-through-public-calls
language: rust
severity: error
message: build an `Entity` with `Entity::from_raw`, never the hidden `Entity::from_engine`, `Entity::NONE` or `Entity::is_none`
note: >-
  The platform hides these items for the layers that carry the engine's
  value through; a hidden item can change in any release without a semver
  signal. `Entity::from_raw(n)` gives `None` for the engine's 0. A developer
  tool may name the engine's 0 and a mod that must write 0 into a point's
  field: each says why and ignores the rule there. The method form
  `entity.is_none()` reads like an `Option` call and is left to review.
ignores:
  - "tools/**"
rule:
  any:
    - pattern: Entity::from_engine
    - pattern: $PATH::Entity::from_engine
    - pattern: Entity::NONE
    - pattern: $PATH::Entity::NONE
    - pattern: Entity::is_none
    - pattern: $PATH::Entity::is_none
