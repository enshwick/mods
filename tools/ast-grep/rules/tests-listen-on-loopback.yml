id: tests-listen-on-loopback
language: rust
severity: error
message: a test listens on 127.0.0.1 or [::1], never on every network
note: >-
  A test program that listens on 0.0.0.0 or [::] raises the Windows firewall
  prompt on a developer's desktop and opens a port to the network while the
  test runs. The rule reads the addresses written in test files as strings,
  `UNSPECIFIED` or an all-zero `Ipv4Addr::new` or `Ipv6Addr::new`; an
  address built from an array or reaching a test from a default elsewhere is
  not seen.
files:
  - "**/tests/**"
  - "**/tests.rs"
rule:
  any:
    - kind: string_content
      regex: '\b0\.0\.0\.0\b|\[::\]|^::$'
    - kind: identifier
      regex: '^UNSPECIFIED$'
    - kind: call_expression
      regex: 'Ipv[46]Addr::new\(\s*0(\s*,\s*0){3,7}\s*,?\s*\)$'
---
id: test-modules-listen-on-loopback
language: rust
severity: error
message: a test listens on 127.0.0.1 or [::1], never on every network
note: >-
  As `tests-listen-on-loopback`, for the `mod tests` of a source file.
rule:
  any:
    - kind: string_content
      regex: '\b0\.0\.0\.0\b|\[::\]|^::$'
    - kind: identifier
      regex: '^UNSPECIFIED$'
    - kind: call_expression
      regex: 'Ipv[46]Addr::new\(\s*0(\s*,\s*0){3,7}\s*,?\s*\)$'
  inside:
    kind: mod_item
    stopBy: end
    has:
      field: name
      regex: '^tests$'
