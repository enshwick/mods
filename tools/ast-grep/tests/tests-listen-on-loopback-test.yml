id: test-modules-listen-on-loopback
valid:
  - |
    fn listen() {
        let socket = TcpListener::bind("0.0.0.0:0");
    }
  - |
    mod tests {
        fn a_client_reaches_the_console() {
            let socket = TcpListener::bind("127.0.0.1:0");
            let other = TcpListener::bind((Ipv6Addr::LOCALHOST, 0));
            let six = TcpListener::bind("[::1]:0");
            let mine = Ipv4Addr::new(127, 0, 0, 1);
        }
    }
  - |
    mod tests {
        fn a_private_network_is_not_every_network() {
            assert!(allowed("10.0.0.0/8"));
        }
    }
invalid:
  - |
    mod tests {
        fn a_client_reaches_the_console() {
            let socket = TcpListener::bind("0.0.0.0:0");
        }
    }
  - |
    mod tests {
        fn settings() -> String {
            format!("rcon_ip = \"[::]\"\nrcon_port = {port}\n")
        }
    }
  - |
    mod tests {
        fn a_client_reaches_the_console() {
            let socket = UdpSocket::bind((Ipv4Addr::UNSPECIFIED, 0));
        }
    }
  - |
    mod tests {
        fn a_client_reaches_the_console() {
            let socket = UdpSocket::bind((Ipv4Addr::new(0, 0, 0, 0), 0));
        }
    }
  - |
    mod tests {
        fn a_client_reaches_the_console() {
            let socket = TcpListener::bind((std::net::Ipv6Addr::new(0, 0, 0, 0, 0, 0, 0, 0), 0));
        }
    }
  - |
    mod tests {
        fn a_client_reaches_the_console() {
            let any: Ipv6Addr = "::".parse().unwrap();
        }
    }
